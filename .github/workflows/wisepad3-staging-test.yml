name: WisePad 3 STAGING TEST APK

on:
  push:
    branches:
      - agent/kiosk-wisepad3-stripe-terminal-usb
    paths:
      - android-kiosk/**
      - src/components/kiosk/KioskPaymentRailStage.tsx
      - src/lib/chargeursPresentationModel.ts
      - src/pages/Kiosk.tsx
      - src/test/chargeursPresentationModel.test.ts
      - docs/kiosk/WISEPAD3_ANDROID_STRIPE_TERMINAL_AUDIT.md
      - .github/workflows/wisepad3-staging-test.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-inspect-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Frontend canonical presentation contract
        run: |
          npm ci
          npx eslint src/components/kiosk/KioskPaymentRailStage.tsx src/lib/chargeursPresentationModel.ts src/pages/Kiosk.tsx src/test/chargeursPresentationModel.test.ts
          npx vitest run src/test/chargeursPresentationModel.test.ts
          npm run build

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v5

      - name: Build STAGING TEST APK
        working-directory: android-kiosk
        env:
          CHARGEURS_ENROLLMENT_URL: https://xqepbqnaenoeyfjkjnzl.supabase.co/functions/v1/kiosk-enroll
          CHARGEURS_KIOSK_PUBLIC_BASE_URL: https://chargeurs-ch-staging.vercel.app
          CHARGEURS_STRIPE_TERMINAL_BACKEND_URL: https://xqepbqnaenoeyfjkjnzl.supabase.co/functions/v1/stripe-terminal-backend
        run: ./gradlew --no-daemon clean testDebugUnitTest lintStaging assembleStaging

      - name: Verify DTA21269 Stripe 2.22 compatibility lane, DEX packaging, package and signer
        shell: bash
        run: |
          set -euo pipefail
          apk="android-kiosk/app/build/outputs/apk/staging/app-staging.apk"
          gradle="android-kiosk/app/build.gradle.kts"
          probe="android-kiosk/app/src/main/java/ch/chargeurs/kiosk/WisePadUsbProbe.java"
          runtime="android-kiosk/app/src/main/java/ch/chargeurs/kiosk/StripeTerminalReaderRuntime.java"
          backend_client="android-kiosk/app/src/main/java/ch/chargeurs/kiosk/StripeTerminalBackendClient.java"
          application="android-kiosk/app/src/main/java/ch/chargeurs/kiosk/ChargeursKioskApplication.java"
          bridge="android-kiosk/app/src/main/java/ch/chargeurs/kiosk/NativeBridge.java"
          kiosk="src/pages/Kiosk.tsx"
          test -s "$apk"
          test -s "$probe"
          test -s "$runtime"
          test -s "$backend_client"
          test -s "$application"
          test -s "$bridge"

          # This APK is an explicit field-compatibility experiment for a broken
          # Android 11 Keymaster. It must use the pre-offline Stripe 2.22 USB API
          # and must never silently drift back to the production 5.x lane.
          grep -F 'implementation("com.stripe:stripeterminal:2.22.0")' "$gradle"
          grep -F 'versionCode = 121' "$gradle"
          grep -F '1.0.21-terminal-compat-v2' "$gradle"
          grep -F 'SDK_COMPAT = "2.22.0-test-only"' "$runtime"
          grep -F 'Terminal.initTerminal(' "$runtime"
          grep -F '.connectUsbReader(' "$runtime"
          grep -F 'new DiscoveryConfiguration.UsbDiscoveryConfiguration' "$runtime"
          grep -F '.discoverReaders(' "$runtime"
          grep -F '.retrievePaymentIntent(' "$runtime"
          grep -F '.collectPaymentMethod(' "$runtime"
          grep -F '.confirmPaymentIntent(' "$runtime"
          if grep -F 'OfflineListener' "$runtime"; then
            echo "Compatibility regression: OfflineListener must not be initialized in the 2.22 field lane" >&2
            exit 1
          fi
          if grep -F '.processPaymentIntent(' "$runtime"; then
            echo "Compatibility regression: v5 processPaymentIntent API leaked into the 2.22 lane" >&2
            exit 1
          fi

          apksigner_path="$(find "${ANDROID_HOME}/build-tools" -type f -name apksigner -perm -u+x | sort -V | tail -1)"
          aapt_path="$(find "${ANDROID_HOME}/build-tools" -type f -name aapt -perm -u+x | sort -V | tail -1)"
          "$apksigner_path" verify --verbose --print-certs "$apk" | tee /tmp/apksigner.txt
          cert_digest="$(sed -n 's/^.*certificate SHA-256 digest: //p' /tmp/apksigner.txt | head -1 | tr '[:upper:]' '[:lower:]')"
          test -n "$cert_digest"
          test "${#cert_digest}" -eq 64
          printf '%s' "$cert_digest" > /tmp/apk_signer_sha256
          badging="$($aapt_path dump badging "$apk")"
          printf '%s\n' "$badging"
          printf '%s\n' "$badging" | grep -F "package: name='ch.chargeurs.kiosk.staging'"
          printf '%s\n' "$badging" | grep -F "versionCode='121'"
          printf '%s\n' "$badging" | grep -F "1.0.21-terminal-compat-v2-staging"
          manifest="$($aapt_path dump xmltree "$apk" AndroidManifest.xml)"
          printf '%s\n' "$manifest" > /tmp/manifest.txt
          grep -F "com.stripe.stripeterminal.internal.common.usb.UsbEventReceiverActivity" /tmp/manifest.txt

          # Preserve the 1.0.19 regression gate: inspect actual DEX payload.
          : > /tmp/dex_strings.txt
          while IFS= read -r dex; do
            unzip -p "$apk" "$dex" | strings >> /tmp/dex_strings.txt
          done < <(zipinfo -1 "$apk" | grep -E '^classes([0-9]+)?\.dex$')
          grep -F 'StripeTerminalBackendClient$ConnectionTokenResult' /tmp/dex_strings.txt
          grep -F 'StripeTerminalBackendClient$PaymentIntentResult' /tmp/dex_strings.txt
          grep -F 'StripeTerminalBackendClient$PaymentStateResult' /tmp/dex_strings.txt
          grep -F 'static final class ConnectionTokenResult' "$backend_client"
          grep -F 'static final class PaymentIntentResult' "$backend_client"
          grep -F 'static final class PaymentStateResult' "$backend_client"

          grep -F "TARGET_VENDOR_ID = 0x15A2" "$probe"
          grep -F "TARGET_PRODUCT_ID = 0x0101" "$probe"
          grep -F "ConnectionTokenProvider" "$runtime"
          grep -F "bootstrapConnectionBinding" "$runtime"
          grep -F "prefetchedConnectionTokenSecret" "$runtime"
          grep -F "STRIPE_FINE_LOCATION_PERMISSION_REQUIRED" "$runtime"
          if grep -F "static StripeTerminalReaderRuntime instance" "$runtime"; then
            echo "static StripeTerminalReaderRuntime singleton would retain Context" >&2
            exit 1
          fi
          grep -F "private StripeTerminalReaderRuntime terminalRuntime" "$application"
          grep -F "application.terminalRuntime(config)" "$bridge"
          grep -F '"readerState"' "$runtime"
          grep -F '"capability"' "$runtime"
          grep -F '"TERMINAL_AND_QR"' "$runtime"
          grep -F '"QR_ONLY"' "$runtime"
          grep -F 'setPhase("payment_ready")' "$kiosk"
          grep -F 'phase === "payment_ready"' "$kiosk"
          grep -F 'phase === "terminal"' "$kiosk"

      - name: Prepare signed APK artifact + complete provenance
        id: artifact
        shell: bash
        run: |
          set -euo pipefail
          apk="android-kiosk/app/build/outputs/apk/staging/app-staging.apk"
          mkdir -p dist
          name="Chargeurs_CH_Kiosk_1.0.21-terminal-compat-v2-staging.apk"
          cp "$apk" "dist/$name"
          apk_sha="$(sha256sum "dist/$name" | awk '{print $1}')"
          signer_sha="$(cat /tmp/apk_signer_sha256)"
          signer_colon="$(printf '%s' "$signer_sha" | sed 's/../&:/g;s/:$//' | tr '[:lower:]' '[:upper:]')"
          printf '%s  %s\n' "$apk_sha" "$name" | tee dist/SHA256SUMS.txt
          cat > dist/PROVENANCE.txt <<EOF
          branch=$GITHUB_REF_NAME
          sha=$GITHUB_SHA
          package=ch.chargeurs.kiosk.staging
          versionCode=121
          versionName=1.0.21-terminal-compat-v2-staging
          environment=STAGING_TEST
          targetUsb=15a2:0101
          stripeTerminalSdk=2.22.0
          compatibilityPurpose=DTA21269_BROKEN_ANDROID11_KEYMASTER_PRE_OFFLINE_USB_PROOF
          productionEligible=false
          terminalBackend=https://xqepbqnaenoeyfjkjnzl.supabase.co/functions/v1/stripe-terminal-backend
          backendContractPR=168
          backendContractSHA=c3fc313f955dc8f40a12c4ef8a33f099888121b6
          physicalEjectionEnabled=false
          paymentMode=TEST_ONLY
          fieldRegression1=NoClassDefFoundError_StripeTerminalBackendClient_ConnectionTokenResult_fixed
          fieldRegression2=Stripe5_7_OfflineAesKeyProvider_Keymaster_DEAD_OBJECT_bypassed_for_diagnostic
          dexPackagingGate=ConnectionTokenResult_PaymentIntentResult_PaymentStateResult_present
          apkSha256=$apk_sha
          signerCertificateSha256=$signer_sha
          signerCertificateSha256Colon=$signer_colon
          signingVerification=apksigner_verify_pass
          installedSignerContinuity=PHYSICAL_GATE_REQUIRED_BEFORE_ADB_INSTALL_R
          rollbackRequirement=RETAIN_PREVIOUS_KNOWN_GOOD_APK_SHA_VERSION_SIGNER
          EOF
          echo "artifact_name=$name" >> "$GITHUB_OUTPUT"

      - name: Upload STAGING TEST APK
        uses: actions/upload-artifact@v4
        with:
          name: wisepad3-${{ steps.artifact.outputs.artifact_name }}
          retention-days: 7
          if-no-files-found: error
          path: dist/*
