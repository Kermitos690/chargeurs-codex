name: WisePad 3 STAGING USB field-test APK

on:
  push:
    branches:
      - agent/kiosk-wisepad3-stripe-terminal-usb
    paths:
      - android-kiosk/**
      - src/components/kiosk/KioskPaymentRailStage.tsx
      - src/lib/chargeursPresentationModel.ts
      - src/pages/Kiosk.tsx
      - src/test/chargeursPresentationModel.test.ts
      - .github/workflows/wisepad3-staging-test.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-inspect-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Frontend canonical presentation contract
        run: |
          npm ci
          npx eslint src/components/kiosk/KioskPaymentRailStage.tsx src/lib/chargeursPresentationModel.ts src/pages/Kiosk.tsx src/test/chargeursPresentationModel.test.ts
          npx vitest run src/test/chargeursPresentationModel.test.ts
          npm run build

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3

      - name: Restore canonical STAGING debug signer
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: chargeurs-kiosk-staging-debug-keystore-v1

      - name: Ensure canonical STAGING debug signer exists
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.android"
          if [ ! -s "$HOME/.android/debug.keystore" ]; then
            keytool -genkeypair \
              -keystore "$HOME/.android/debug.keystore" \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -dname "CN=Chargeurs STAGING TEST,O=Chargeurs.ch,C=CH" \
              -keyalg RSA -keysize 2048 -validity 10000
          fi
          chmod 600 "$HOME/.android/debug.keystore"
          keytool -list -v -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey | tee /tmp/staging-keytool.txt
          sed -n 's/^[[:space:]]*SHA256: //p' /tmp/staging-keytool.txt | head -1 | tr -d ':' | tr '[:upper:]' '[:lower:]' > /tmp/canonical_staging_signer_sha256
          test "$(wc -c < /tmp/canonical_staging_signer_sha256 | tr -d ' ')" -ge 64
          expected_signer="b37d4cda37c8623259dfc7aa408328b8f2d04911082c46073b6e1b429ba805a3"
          actual_signer="$(cat /tmp/canonical_staging_signer_sha256 | tr -d '\n')"
          test "$actual_signer" = "$expected_signer" || {
            echo "Canonical STAGING signer mismatch; refusing to produce a non-updatable APK" >&2
            exit 24
          }

      - uses: gradle/actions/setup-gradle@v5

      - name: Build STAGING WisePad USB field-test APK
        working-directory: android-kiosk
        env:
          CHARGEURS_ENROLLMENT_URL: https://xqepbqnaenoeyfjkjnzl.supabase.co/functions/v1/kiosk-enroll
          CHARGEURS_KIOSK_PUBLIC_BASE_URL: https://chargeurs-ch-staging.vercel.app
          CHARGEURS_KIOSK_WEB_BASE_URL: https://chargeurs-ch-staging.vercel.app
          CHARGEURS_STRIPE_TERMINAL_BACKEND_URL: https://xqepbqnaenoeyfjkjnzl.supabase.co/functions/v1/stripe-terminal-backend
        run: CHARGEURS_STAGING_KEYSTORE_PATH="$HOME/.android/debug.keystore" ./gradlew --no-daemon clean testDebugUnitTest lintStaging assembleStaging

      - name: Verify 1.0.27 WisePad USB field-test APK, DEX and signer
        shell: bash
        run: |
          set -euo pipefail
          apk="android-kiosk/app/build/outputs/apk/staging/app-staging.apk"
          gradle="android-kiosk/app/build.gradle.kts"
          config="android-kiosk/app/src/main/java/ch/chargeurs/kiosk/KioskConfig.java"
          validator="android-kiosk/app/src/main/java/ch/chargeurs/kiosk/KioskConfigValidator.java"
          physical_runtime="android-kiosk/app/src/main/java/ch/chargeurs/kiosk/StripeTerminalReaderRuntime.java"
          bridge="android-kiosk/app/src/main/java/ch/chargeurs/kiosk/NativeBridge.java"
          kiosk="src/pages/Kiosk.tsx"
          canonical="https://chargeurs-ch-staging.vercel.app"
          forbidden_preview="chargeurs-ch-staging-git-agent-550b8f-gaetans-projects-4974c31a.vercel.app"

          test -s "$apk"
          grep -F 'versionCode = 127' "$gradle"
          grep -F '1.0.27-wisepad-usb-staging-v1' "$gradle"
          grep -F 'stagingKioskPublicBaseUrl = "https://chargeurs-ch-staging.vercel.app"' "$gradle"
          grep -F 'stagingKioskWebBaseUrl = "https://chargeurs-ch-staging.vercel.app"' "$gradle"
          ! grep -F "$forbidden_preview" "$gradle"
          grep -F 'KIOSK_WEB_BASE_URL' "$gradle"
          grep -F 'KioskConfigValidator.webBaseUrl(baseUrl)' "$config"
          grep -F 'BuildConfig.KIOSK_WEB_BASE_URL' "$validator"
          grep -F 'implementation("com.stripe:stripeterminal:2.22.0")' "$gradle"
          grep -F 'implementation("androidx.core:core:1.13.1")' "$gradle"
          grep -F 'buildConfigField("boolean", "HARDWARE_EJECTION_ENABLED", "false")' "$gradle"
          grep -F 'buildConfigField("boolean", "STRIPE_TERMINAL_USB_TEST_ENABLED", "true")' "$gradle"
          grep -F 'buildConfigField("boolean", "STRIPE_TERMINAL_SIMULATED_TEST_ENABLED", "false")' "$gradle"
          grep -F 'SDK_COMPAT = "2.22.0-test-only"' "$physical_runtime"
          grep -F 'new DiscoveryConfiguration(0, DiscoveryMethod.USB, false)' "$physical_runtime"
          grep -F '.connectUsbReader(' "$physical_runtime"
          grep -F '.collectPaymentMethod(' "$physical_runtime"
          grep -F '.processPayment(' "$physical_runtime"
          grep -F 'BuildConfig.STRIPE_TERMINAL_SIMULATED_TEST_ENABLED' "$bridge"
          grep -F 'return error("HARDWARE_EJECTION_DISABLED")' "$bridge"
          grep -F 'setPhase("payment_ready")' "$kiosk"
          grep -F 'phase === "payment_ready"' "$kiosk"
          grep -F 'phase === "terminal"' "$kiosk"

          aapt_path="$(find "${ANDROID_HOME}/build-tools" -type f -name aapt -perm -u+x | sort -V | tail -1)"
          apksigner_path="$(find "${ANDROID_HOME}/build-tools" -type f -name apksigner -perm -u+x | sort -V | tail -1)"
          badging="$($aapt_path dump badging "$apk")"
          printf '%s\n' "$badging" | grep -F "package: name='ch.chargeurs.kiosk.staging'"
          printf '%s\n' "$badging" | grep -F "versionCode='127'"
          printf '%s\n' "$badging" | grep -F "1.0.27-wisepad-usb-staging-v1-staging"

          "$apksigner_path" verify --verbose --print-certs "$apk" | tee /tmp/apksigner.txt
          cert_digest="$(sed -n 's/^.*certificate SHA-256 digest: //p' /tmp/apksigner.txt | head -1 | tr '[:upper:]' '[:lower:]')"
          canonical_digest="$(cat /tmp/canonical_staging_signer_sha256 | tr -d '\n')"
          test "$cert_digest" = "$canonical_digest"
          printf '%s' "$cert_digest" > /tmp/apk_signer_sha256

          : > /tmp/dex_strings.txt
          while IFS= read -r dex; do unzip -p "$apk" "$dex" | strings >> /tmp/dex_strings.txt; done < <(zipinfo -1 "$apk" | grep -E '^classes([0-9]+)?\.dex$')
          grep -F 'StripeTerminalReaderRuntime' /tmp/dex_strings.txt
          grep -F 'StripeTerminalBackendClient$ConnectionTokenResult' /tmp/dex_strings.txt
          grep -F 'StripeTerminalBackendClient$PaymentIntentResult' /tmp/dex_strings.txt
          grep -F 'StripeTerminalBackendClient$PaymentStateResult' /tmp/dex_strings.txt
          grep -F 'androidx/core/content/ContextCompat' /tmp/dex_strings.txt
          grep -F 'chargeurs-ch-staging.vercel.app' /tmp/dex_strings.txt
          ! grep -F "$forbidden_preview" /tmp/dex_strings.txt

      - name: Prepare signed WisePad USB field-test APK + provenance
        id: artifact
        shell: bash
        run: |
          set -euo pipefail
          apk="android-kiosk/app/build/outputs/apk/staging/app-staging.apk"
          mkdir -p dist
          name="Chargeurs_CH_Kiosk_1.0.27-wisepad-usb-staging-v1-staging.apk"
          cp "$apk" "dist/$name"
          apk_sha="$(sha256sum "dist/$name" | awk '{print $1}')"
          signer_sha="$(cat /tmp/apk_signer_sha256)"
          printf '%s  %s\n' "$apk_sha" "$name" | tee dist/SHA256SUMS.txt
          cat > dist/PROVENANCE.txt <<EOF
          branch=$GITHUB_REF_NAME
          sha=$GITHUB_SHA
          package=ch.chargeurs.kiosk.staging
          versionCode=127
          versionName=1.0.27-wisepad-usb-staging-v1-staging
          environment=STAGING_TEST
          enrollmentBase=https://chargeurs-ch-staging.vercel.app
          frontend=https://chargeurs-ch-staging.vercel.app
          stripeTerminalSdk=2.22.0
          readerMode=USB_WISEPAD_3
          simulatedReader=false
          physicalWisePadReference=tmr_GnorJgwc2oWVq3
          productionEligible=false
          physicalEjectionEnabled=false
          paymentMode=TEST_ONLY
          apkSha256=$apk_sha
          signerCertificateSha256=$signer_sha
          signingVerification=apksigner_verify_pass
          rollbackRequirement=RESTORE_1.0.26_SIMULATOR_APK_IF_USB_FIELD_TEST_FAILS
          EOF
          echo "artifact_name=$name" >> "$GITHUB_OUTPUT"

      - name: Upload STAGING WisePad USB field-test APK
        uses: actions/upload-artifact@v4
        with:
          name: wisepad3-${{ steps.artifact.outputs.artifact_name }}
          retention-days: 7
          if-no-files-found: error
          path: dist/*
