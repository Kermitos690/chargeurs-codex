name: Deploy staging diagnostic enrollment

on:
  push:
    branches:
      - agent/chargenow-local-diagnostics
    paths:
      - "supabase/functions/kiosk-enroll-diagnostic/**"
      - "supabase/functions/_shared/db.ts"
      - "supabase/functions/_shared/kioskEnrollment.ts"
      - ".github/workflows/deploy-staging-diagnostic.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-staging-diagnostic
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: staging
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: xqepbqnaenoeyfjkjnzl
    steps:
      - name: Checkout diagnostic branch
        uses: actions/checkout@v6

      - name: Require staging deployment token
        shell: bash
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "SUPABASE_ACCESS_TOKEN is not configured in the staging environment."
            exit 1
          fi

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Deploy isolated diagnostic enrollment
        run: >-
          supabase functions deploy kiosk-enroll-diagnostic
          --project-ref "$SUPABASE_PROJECT_REF"
          --no-verify-jwt

      - name: Verify deployed endpoint contract
        shell: bash
        run: |
          response=$(curl --fail-with-body --silent --show-error \
            --request POST \
            --header 'Content-Type: application/json' \
            --data '{}' \
            "https://${SUPABASE_PROJECT_REF}.supabase.co/functions/v1/kiosk-enroll-diagnostic" \
            || true)
          echo "$response"
          echo "$response" | grep -q 'INVALID_DIAGNOSTIC_ENROLLMENT'
