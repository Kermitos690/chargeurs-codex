name: Chargeurs.ch Android Kiosk Build

on:
  workflow_dispatch:
  pull_request:
    branches:
      - agent/kiosk-wisepad3-stripe-terminal-usb
    paths:
      - "android-kiosk/**"
      - ".github/workflows/android-kiosk-ci.yml"

permissions:
  contents: read

concurrency:
  group: android-kiosk-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-staging-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # This is the existing TEST-only canonical STAGING signer. The private
      # keystore bytes live in the Actions cache created on the Android field
      # branch; these are the standard non-secret debug-keystore credentials.
      CHARGEURS_STAGING_KEYSTORE_PASSWORD: android
      CHARGEURS_STAGING_KEY_ALIAS: androiddebugkey
      CHARGEURS_STAGING_KEY_PASSWORD: android
      CHARGEURS_STAGING_EXPECTED_SIGNER_SHA256: b37d4cda37c8623259dfc7aa408328b8f2d04911082c46073b6e1b429ba805a3
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3

      - name: Restore canonical STAGING signer from the field branch
        id: staging-signer-cache
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: chargeurs-kiosk-staging-debug-keystore-v1

      - name: Require canonical signer continuity
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ steps.staging-signer-cache.outputs.cache-hit }}" != "true" ]]; then
            echo "::error title=Canonical staging signer unavailable::The PR build could not restore chargeurs-kiosk-staging-debug-keystore-v1 from its base field branch. Refusing to create a DTA APK with a new signer."
            exit 23
          fi

          keystore="$HOME/.android/debug.keystore"
          test -s "$keystore"
          chmod 600 "$keystore"
          keytool -list -v \
            -keystore "$keystore" \
            -storepass "$CHARGEURS_STAGING_KEYSTORE_PASSWORD" \
            -alias "$CHARGEURS_STAGING_KEY_ALIAS" | tee /tmp/staging-keytool.txt

          actual="$(sed -n 's/^[[:space:]]*SHA256: //p' /tmp/staging-keytool.txt | head -1 | tr -d ':' | tr '[:upper:]' '[:lower:]')"
          expected="$(printf '%s' "$CHARGEURS_STAGING_EXPECTED_SIGNER_SHA256" | tr -d ':' | tr '[:upper:]' '[:lower:]')"
          if [[ "$actual" != "$expected" ]]; then
            echo "::error title=Canonical signer mismatch::Expected $expected but restored $actual. Refusing to build a non-updatable DTA APK."
            exit 24
          fi

          echo "CHARGEURS_STAGING_KEYSTORE_PATH=$keystore" >> "$GITHUB_ENV"

      - uses: gradle/actions/setup-gradle@v5

      - name: Build and test staging APK
        working-directory: android-kiosk
        env:
          CHARGEURS_ENROLLMENT_URL: https://xqepbqnaenoeyfjkjnzl.supabase.co/functions/v1/kiosk-enroll
          CHARGEURS_KIOSK_PUBLIC_BASE_URL: https://chargeurs-ch-staging.vercel.app
        run: ./gradlew --no-daemon clean testDebugUnitTest lintStaging assembleStaging

      - name: Prepare APK and signing provenance
        id: artifact
        shell: bash
        run: |
          set -euo pipefail
          apk="android-kiosk/app/build/outputs/apk/staging/app-staging.apk"
          test -s "$apk"

          apksigner_path="$(find "${ANDROID_HOME}/build-tools" -type f -name apksigner -perm -u+x | sort -V | tail -1)"
          test -n "$apksigner_path"
          "$apksigner_path" verify --verbose "$apk"

          cert_output="$($apksigner_path verify --print-certs "$apk")"
          signer_sha256="$(printf '%s\n' "$cert_output" | sed -n 's/^Signer #1 certificate SHA-256 digest: //p' | head -1 | tr '[:upper:]' '[:lower:]' | tr -d ':[:space:]')"
          expected="$(printf '%s' "$CHARGEURS_STAGING_EXPECTED_SIGNER_SHA256" | tr '[:upper:]' '[:lower:]' | tr -d ':[:space:]')"
          test -n "$signer_sha256"
          if [[ "$signer_sha256" != "$expected" ]]; then
            echo "::error title=APK signer continuity failure::Built signer $signer_sha256 does not match canonical STAGING signer $expected."
            exit 25
          fi

          aapt_path="$(find "${ANDROID_HOME}/build-tools" -type f -name aapt -perm -u+x | sort -V | tail -1)"
          test -n "$aapt_path"
          badging="$($aapt_path dump badging "$apk")"
          version_name="$(printf '%s\n' "$badging" | sed -n "s/.*versionName='\([^']*\)'.*/\1/p" | head -1)"
          version_code="$(printf '%s\n' "$badging" | sed -n "s/.*versionCode='\([^']*\)'.*/\1/p" | head -1)"
          package_name="$(printf '%s\n' "$badging" | sed -n "s/package: name='\([^']*\)'.*/\1/p" | head -1)"
          test -n "$version_name"
          test -n "$version_code"
          test -n "$package_name"

          mkdir -p dist
          artifact_name="Chargeurs_CH_Kiosk_${version_name}.apk"
          cp "$apk" "dist/$artifact_name"
          apk_sha256="$(sha256sum "dist/$artifact_name" | awk '{print $1}')"
          printf '%s  %s\n' "$apk_sha256" "$artifact_name" > dist/SHA256SUMS.txt
          cat > dist/BUILD_IDENTITY.txt <<EOF
          package=$package_name
          versionCode=$version_code
          versionName=$version_name
          gitSha=$GITHUB_SHA
          signingMode=canonical-staging-cache-v1
          signerSha256=$signer_sha256
          fieldInstallable=true
          fieldTarget=DTA21277
          fieldTargetHuman=DTA 212-77
          updateMode=IN_PLACE_ONLY_IF_INSTALLED_SIGNER_MATCHES
          EOF

          echo "artifact_name=$artifact_name" >> "$GITHUB_OUTPUT"
          echo "signer_sha256=$signer_sha256" >> "$GITHUB_OUTPUT"
          echo "apk_sha256=$apk_sha256" >> "$GITHUB_OUTPUT"

      - name: Upload DTA21277 staging APK and provenance
        uses: actions/upload-artifact@v4
        with:
          name: dta21277-${{ steps.artifact.outputs.artifact_name }}
          retention-days: 7
          if-no-files-found: error
          path: dist/*
