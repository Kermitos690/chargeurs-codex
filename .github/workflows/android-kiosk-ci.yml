name: Chargeurs.ch Android Kiosk Build

on:
  pull_request:
    paths:
      - "android-kiosk/**"
      - ".github/workflows/android-kiosk-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-kiosk-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build-staging-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v5

      - name: Build staging APK
        working-directory: android-kiosk
        shell: bash
        env:
          CHARGEURS_ENROLLMENT_URL: https://xqepbqnaenoeyfjkjnzl.supabase.co/functions/v1/kiosk-enroll
          CHARGEURS_KIOSK_PUBLIC_BASE_URL: https://chargeurs-ch-staging.vercel.app
        run: |
          set -o pipefail
          mkdir -p ../dist
          ./gradlew --no-daemon clean testDebugUnitTest lintDebug assembleDebug --stacktrace 2>&1 \
            | tee ../dist/android-build.log

      - name: Prepare APK artifact
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          apk="android-kiosk/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$apk"
          cp "$apk" dist/chargeurs-kiosk-staging-v1.0.3-shadow-debug.apk
          sha256sum dist/chargeurs-kiosk-staging-v1.0.3-shadow-debug.apk > dist/SHA256SUMS.txt

      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chargeurs-kiosk-build-log
          retention-days: 7
          if-no-files-found: warn
          path: dist/android-build.log

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: chargeurs-kiosk-staging-v1.0.3-shadow-debug
          retention-days: 7
          if-no-files-found: error
          path: |
            dist/chargeurs-kiosk-staging-v1.0.3-shadow-debug.apk
            dist/SHA256SUMS.txt
