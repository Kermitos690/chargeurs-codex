name: Cancel expired DTA21269 Terminal authorization once

on:
  push:
    branches:
      - ops/chargeurs-mac-remote
    paths:
      - .github/workflows/ops-cancel-9dab-via-mac.yml

permissions:
  contents: read

concurrency:
  group: cancel-dta21269-9dab-once
  cancel-in-progress: false

jobs:
  cancel:
    runs-on: [self-hosted, macOS, chargeurs-adb]
    timeout-minutes: 5
    steps:
      - name: Cancel exact expired staging authorization
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ops-output
          url='https://xqepbqnaenoeyfjkjnzl.supabase.co/functions/v1/ops-cancel-broken-authorization-once?permit=cancel-9dab-expired-auth-20260822-v1'
          curl --fail-with-body --silent --show-error --max-time 30 "$url" | tee ops-output/cancel-9dab.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          data=json.loads(Path('ops-output/cancel-9dab.json').read_text())
          if data.get('ok') is not True or data.get('stripeStatus') != 'canceled':
              raise SystemExit(f"cancel rejected: {data}")
          print('CANCEL_OK', data)
          PY
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cancel-dta21269-9dab-${{ github.run_id }}
          retention-days: 2
          if-no-files-found: error
          path: ops-output/cancel-9dab.json
