name: Kiosk UI CI

on:
  pull_request:
    paths:
      - "src/pages/KioskPremiumGate.tsx"
      - "src/pages/Kiosk.tsx"
      - "src/pages/kiosk-cinematic-home.css"
      - "src/pages/kiosk-da-master.css"
      - "src/components/LanguageSwitcher.tsx"
      - "src/i18n/**"
      - "src/pages/account/AccountPass.tsx"
      - "supabase/functions/account-privacy/**"
      - "supabase/functions/_shared/passStudio.ts"
      - "supabase/functions/_shared/passStudioWallet.ts"
      - "supabase/migrations/*pass_studio_wallet_provider.sql"
      - "scripts/check-wallet-pass-studio.mjs"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/kiosk-ui-ci.yml"
  push:
    branches: [main]
    paths:
      - "src/pages/KioskPremiumGate.tsx"
      - "src/pages/Kiosk.tsx"
      - "src/pages/kiosk-cinematic-home.css"
      - "src/pages/kiosk-da-master.css"
      - "src/components/LanguageSwitcher.tsx"
      - "src/i18n/**"
      - "src/pages/account/AccountPass.tsx"
      - "supabase/functions/account-privacy/**"
      - "supabase/functions/_shared/passStudio.ts"
      - "supabase/functions/_shared/passStudioWallet.ts"
      - "supabase/migrations/*pass_studio_wallet_provider.sql"
      - "scripts/check-wallet-pass-studio.mjs"

permissions:
  contents: read

concurrency:
  group: kiosk-ui-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Wallet provider contract
        shell: bash
        run: |
          set -euo pipefail
          if git grep -nE 'ps_live_[A-Za-z0-9_-]+' -- . ':!package-lock.json'; then
            echo "::error::A Pass Studio live key is present in tracked source"
            exit 1
          fi
          node scripts/check-wallet-pass-studio.mjs
      - name: TypeScript
        run: npm run typecheck
      - name: Frontend tests
        run: npm test
      - name: Production build
        run: npm run build
