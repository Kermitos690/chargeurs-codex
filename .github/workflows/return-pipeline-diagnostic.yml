name: Return pipeline diagnostic

on:
  push:
    branches: [feat/chargeurs-platform-api-v1]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deno:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Check return correlation
        run: deno check supabase/functions/_shared/returnCorrelation.ts
      - name: Check return settlement helper
        run: deno check supabase/functions/_shared/returnSettlement.ts
      - name: Check settlement worker
        run: deno check supabase/functions/rental-settlement-worker/index.ts
      - name: Check ChargeNow callback
        run: deno check supabase/functions/chargenow-rent-callback/index.ts
      - name: Check cabinet event callback
        run: deno check supabase/functions/cabinet-event-push/index.ts
      - name: Check ejection function
        run: deno check supabase/functions/eject-after-payment/index.ts
