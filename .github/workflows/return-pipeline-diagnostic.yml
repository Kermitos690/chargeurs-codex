name: Return pipeline diagnostic

on:
  pull_request:
    branches: [main]
  push:
    branches: [feat/chargeurs-platform-api-v1]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deno:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Capture settlement worker check
        run: |
          set +e
          deno check supabase/functions/rental-settlement-worker/index.ts > settlement-worker-check.log 2>&1
          echo $? > settlement-worker-exit.txt
          exit 0
      - uses: actions/upload-artifact@v4
        with:
          name: settlement-worker-diagnostic
          path: |
            settlement-worker-check.log
            settlement-worker-exit.txt
          if-no-files-found: error
      - name: Fail when check failed
        run: |
          test "$(cat settlement-worker-exit.txt)" = "0"
