name: Pricing v2 candidate CI

on:
  push:
    branches:
      - a0/settlement-pricing-v2

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Check settlement candidate
        run: |
          deno check supabase/functions/_shared/pricingSnapshot.ts
          deno check supabase/functions/settle-rental-payment/index.ts
      - name: Run settlement pricing tests
        run: |
          deno test --allow-read --allow-env --allow-net --no-check \
            supabase/functions/tests/pricing_settlement_v2.test.ts \
            supabase/functions/tests/settlement.test.ts
