name: Chargeurs.ch Manual CI

# Cost control: this workflow never runs automatically.
# Launch it once after a coherent batch of changes is ready to validate.
on:
  workflow_dispatch:
    inputs:
      run_edge_checks:
        description: "Run Deno checks for kiosk and rental lifecycle"
        required: true
        default: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: chargeurs-manual-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies deterministically
        run: npm ci --legacy-peer-deps --prefer-offline --no-audit --no-fund

      - name: Frontend quality gate
        run: |
          npm run lint -- --quiet
          npm run typecheck
          npm test
          npm run build

      - if: inputs.run_edge_checks == true
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Check critical Edge Functions
        if: inputs.run_edge_checks == true
        run: |
          set -euo pipefail
          for file in \
            supabase/functions/sync-cabinet-status/index.ts \
            supabase/functions/create-stripe-checkout/index.ts \
            supabase/functions/stripe-webhook/index.ts \
            supabase/functions/eject-after-payment/index.ts \
            supabase/functions/chargenow-rent-callback/index.ts \
            supabase/functions/settle-rental-payment/index.ts; do
            deno check "$file"
          done

      - name: Test critical rental contracts
        if: inputs.run_edge_checks == true
        run: |
          deno test --allow-read --allow-env \
            supabase/functions/tests/kiosk_sync_auth_contract.test.ts \
            supabase/functions/tests/settlement.test.ts \
            supabase/functions/tests/orchestrator_runtime.test.ts \
            supabase/functions/tests/chargenow_callback_auth.test.ts \
            supabase/functions/tests/settlement_retry_contract.test.ts

      - name: Security regression scan
        if: inputs.run_edge_checks == true
        shell: bash
        run: |
          set -euo pipefail
          files=(
            supabase/functions/create-stripe-checkout/index.ts
            supabase/functions/stripe-webhook/index.ts
            supabase/functions/eject-after-payment/index.ts
            supabase/functions/chargenow-rent-callback/index.ts
            supabase/functions/settle-rental-payment/index.ts
            supabase/functions/_shared/settlementRuntime.ts
          )
          ! grep -nE 'error:[[:space:]]*String\(|detail:[[:space:]]*String\(' "${files[@]}"
          ! grep -nE 'searchParams\.get\("secret"\)' \
            supabase/functions/chargenow-rent-callback/index.ts \
            supabase/functions/_shared/chargenowCallbackAuth.ts
