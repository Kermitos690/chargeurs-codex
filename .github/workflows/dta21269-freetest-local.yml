name: DTA21269 DEX call graph analyzer APK

on:
  pull_request:
    paths:
      - .github/workflows/dta21269-freetest-local.yml
      - android-kiosk/**
  push:
    branches:
      - agent/dta21269-freetest-local
      - agent/dta21269-dex-callgraph
    paths:
      - .github/workflows/dta21269-freetest-local.yml
      - android-kiosk/**
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dta21269-dex-callgraph-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v5

      - name: Unit tests
        working-directory: android-kiosk
        run: ./gradlew --no-daemon testDebugUnitTest

      - name: Build DEX call graph analyzer APK
        working-directory: android-kiosk
        run: ./gradlew --no-daemon clean assembleDebug

      - name: Verify APK and prepare delivery
        shell: bash
        run: |
          set -euo pipefail
          apk="android-kiosk/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$apk"
          mkdir -p dist
          cp "$apk" dist/Chargeurs-ch-DTA21269-DEX-CallGraph-Analyzer-v1.4.0.apk
          sha256sum dist/Chargeurs-ch-DTA21269-DEX-CallGraph-Analyzer-v1.4.0.apk > dist/SHA256SUMS.txt
          cat > dist/INSTALLATION.txt <<'TXT'
          CHARGEURS.CH — DTA21269 DEX CALL GRAPH ANALYZER
          =================================================

          Package : ch.chargeurs.kiosk.analyzer
          Station : DTA21269
          Version : 1.4.0-local
          Paiement : aucun / 0 CHF
          Coexistence : installation parallèle au FreeTest et à BajieTouchPower

          Cette version :
          - exclut les ressources Stripe de l'analyse ;
          - lit les tables de chaînes, classes, champs et méthodes des DEX ;
          - lit passivement class_data_item, code_item et les instructions invoke ;
          - construit le graphe d'appels des méthodes du paquet fournisseur ;
          - cherche des chemins statiques depuis PaymentEndActivity et initBatteryRental ;
          - cible getCommPort, openPort, writeBytes, readBytes et setComPortParameters ;
          - affiche les littéraux de la méthode appelante uniquement comme contexte ;
          - exporte un JSON schemaVersion 3 dans Téléchargements/Chargeurs ;
          - ne copie pas l'APK fournisseur ;
          - n'exécute aucun code fournisseur ;
          - n'ouvre pas /dev/ttyS1 ;
          - n'envoie aucun octet au PCB ;
          - ne prétend pas que le protocole DTA est résolu ;
          - ne peut pas éjecter de batterie.

          Ne désinstallez pas com.szbjkj.bajietouchpower, HappyNet ou Chargeurs FreeTest.
          TXT

      - name: Upload DEX call graph analyzer kit
        uses: actions/upload-artifact@v4
        with:
          name: Chargeurs-ch-DTA21269-DEX-CallGraph-Analyzer-v1.4.0
          retention-days: 14
          if-no-files-found: error
          path: dist/*
