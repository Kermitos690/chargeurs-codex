name: DTA21269 FreeTest local APK

on:
  pull_request:
    paths:
      - .github/workflows/dta21269-freetest-local.yml
      - android-kiosk/**
  push:
    branches:
      - agent/dta21269-freetest-local
    paths:
      - .github/workflows/dta21269-freetest-local.yml
      - android-kiosk/**
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dta21269-freetest-local-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v5

      - name: Unit tests
        working-directory: android-kiosk
        run: ./gradlew --no-daemon testDebugUnitTest

      - name: Build FreeTest APK
        working-directory: android-kiosk
        run: ./gradlew --no-daemon clean assembleDebug

      - name: Verify APK and prepare delivery
        shell: bash
        run: |
          set -euo pipefail
          apk="android-kiosk/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$apk"
          mkdir -p dist
          cp "$apk" dist/Chargeurs-ch-DTA21269-Analyzer-v1.2.0.apk
          sha256sum dist/Chargeurs-ch-DTA21269-Analyzer-v1.2.0.apk > dist/SHA256SUMS.txt
          cat > dist/INSTALLATION.txt <<'TXT'
          CHARGEURS.CH — DTA21269 ANALYSE PASSIVE
          =======================================

          Package : ch.chargeurs.kiosk.freetest
          Station : DTA21269
          Paiement : aucun / 0 CHF
          Coexistence : BajieTouchPower et HappyNet restent installés

          Cette version conserve le FreeTest v1.1.0 et ajoute une seconde icône
          « Chargeurs Analyse » qui :
          - calcule les empreintes SHA-256 de l'APK fournisseur et de ses DEX/.so ;
          - inventorie les bibliothèques natives et les ressources techniques ;
          - recherche des indices CLOUDPOS_SERIAL, ttyS1, baud, 9600, CRC,
            checksum, slot, eject, cabinet et battery ;
          - exporte un JSON dans Téléchargements/Chargeurs ;
          - ne copie pas l'APK fournisseur ;
          - n'exécute aucun code fournisseur ;
          - n'ouvre pas /dev/ttyS1 ;
          - n'envoie aucun octet au PCB ;
          - ne peut pas éjecter de batterie.

          Ne désinstallez pas BajieTouchPower ou HappyNet.
          TXT

      - name: Upload installable analyzer kit
        uses: actions/upload-artifact@v4
        with:
          name: Chargeurs-ch-DTA21269-Analyzer-v1.2.0
          retention-days: 14
          if-no-files-found: error
          path: dist/*
