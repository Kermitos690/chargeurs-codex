name: Kiosk UX direct Vercel release

on:
  push:
    branches:
      - main
    paths:
      - .deploy/kiosk-ux-release-trigger

permissions:
  contents: write

jobs:
  deploy-production:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Verify Vercel credentials
        id: credentials
        continue-on-error: true
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          test -n "$VERCEL_TOKEN" || { echo "VERCEL_TOKEN is not configured"; exit 21; }
          test -n "$VERCEL_ORG_ID" || { echo "VERCEL_ORG_ID is not configured"; exit 22; }
          test -n "$VERCEL_PROJECT_ID" || { echo "VERCEL_PROJECT_ID is not configured"; exit 23; }

      - name: Install dependencies
        id: install
        if: steps.credentials.outcome == 'success'
        continue-on-error: true
        run: npm ci --no-audit --no-fund

      - name: Build production bundle
        id: app_build
        if: steps.credentials.outcome == 'success' && steps.install.outcome == 'success'
        continue-on-error: true
        run: npm run build

      - name: Link Vercel project
        id: link
        if: steps.credentials.outcome == 'success' && steps.install.outcome == 'success' && steps.app_build.outcome == 'success'
        continue-on-error: true
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          mkdir -p .vercel
          printf '{"orgId":"%s","projectId":"%s"}\n' "$VERCEL_ORG_ID" "$VERCEL_PROJECT_ID" > .vercel/project.json

      - name: Pull production environment
        id: vercel_pull
        if: steps.credentials.outcome == 'success' && steps.install.outcome == 'success' && steps.app_build.outcome == 'success' && steps.link.outcome == 'success'
        continue-on-error: true
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: npx --yes vercel@latest pull --yes --environment=production --token="$VERCEL_TOKEN"

      - name: Build Vercel prebuilt output
        id: vercel_build
        if: steps.vercel_pull.outcome == 'success'
        continue-on-error: true
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: npx --yes vercel@latest build --prod --token="$VERCEL_TOKEN"

      - name: Deploy prebuilt production
        id: deploy
        if: steps.vercel_build.outcome == 'success'
        continue-on-error: true
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: npx --yes vercel@latest deploy --prebuilt --prod --token="$VERCEL_TOKEN"

      - name: Record Agent 4 release diagnostics
        if: always()
        env:
          CREDENTIALS: ${{ steps.credentials.outcome }}
          INSTALL: ${{ steps.install.outcome }}
          APP_BUILD: ${{ steps.app_build.outcome }}
          LINK: ${{ steps.link.outcome }}
          VERCEL_PULL: ${{ steps.vercel_pull.outcome }}
          VERCEL_BUILD: ${{ steps.vercel_build.outcome }}
          DEPLOY: ${{ steps.deploy.outcome }}
        run: |
          status=failure
          failure_stage=unknown
          if [ "$CREDENTIALS" != "success" ]; then
            failure_stage=credentials
          elif [ "$INSTALL" != "success" ]; then
            failure_stage=install
          elif [ "$APP_BUILD" != "success" ]; then
            failure_stage=app_build
          elif [ "$LINK" != "success" ]; then
            failure_stage=link
          elif [ "$VERCEL_PULL" != "success" ]; then
            failure_stage=vercel_pull
          elif [ "$VERCEL_BUILD" != "success" ]; then
            failure_stage=vercel_build
          elif [ "$DEPLOY" != "success" ]; then
            failure_stage=deploy
          else
            status=success
            failure_stage=none
          fi

          mkdir -p .deploy
          printf 'status=%s\nfailure_stage=%s\ncredentials=%s\ninstall=%s\napp_build=%s\nlink=%s\nvercel_pull=%s\nvercel_build=%s\ndeploy=%s\nsource_commit=%s\ncompleted_at=%s\n' \
            "$status" "$failure_stage" "$CREDENTIALS" "$INSTALL" "$APP_BUILD" "$LINK" "$VERCEL_PULL" "$VERCEL_BUILD" "$DEPLOY" "${{ github.sha }}" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            > .deploy/kiosk-ux-release-status

          git config user.name "chargeurs-kiosk-ux-bot"
          git config user.email "actions@users.noreply.github.com"
          git add .deploy/kiosk-ux-release-status
          git commit -m "chore(kiosk-ux): record production release diagnostics" || exit 0
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Fail workflow when production deploy failed
        if: always() && steps.deploy.outcome != 'success'
        run: exit 1
