name: Kiosk UX direct Vercel release

on:
  push:
    branches:
      - main
    paths:
      - .deploy/kiosk-ux-release-trigger

permissions:
  contents: write

jobs:
  deploy-production:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Verify Vercel credentials
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          test -n "$VERCEL_TOKEN" || { echo "VERCEL_TOKEN is not configured"; exit 21; }
          test -n "$VERCEL_ORG_ID" || { echo "VERCEL_ORG_ID is not configured"; exit 22; }
          test -n "$VERCEL_PROJECT_ID" || { echo "VERCEL_PROJECT_ID is not configured"; exit 23; }

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Build production bundle
        run: npm run build

      - name: Link Vercel project
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          mkdir -p .vercel
          printf '{"orgId":"%s","projectId":"%s"}\n' "$VERCEL_ORG_ID" "$VERCEL_PROJECT_ID" > .vercel/project.json

      - name: Pull production environment
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: npx --yes vercel@latest pull --yes --environment=production --token="$VERCEL_TOKEN"

      - name: Build Vercel prebuilt output
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: npx --yes vercel@latest build --prod --token="$VERCEL_TOKEN"

      - name: Deploy prebuilt production
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: npx --yes vercel@latest deploy --prebuilt --prod --token="$VERCEL_TOKEN"

      - name: Record Agent 4 release result
        if: always()
        run: |
          mkdir -p .deploy
          printf 'status=%s\nsource_commit=%s\ncompleted_at=%s\n' "${{ job.status }}" "${{ github.sha }}" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > .deploy/kiosk-ux-release-status
          git config user.name "chargeurs-kiosk-ux-bot"
          git config user.email "actions@users.noreply.github.com"
          git add .deploy/kiosk-ux-release-status
          git commit -m "chore(kiosk-ux): record production release ${{ job.status }}" || exit 0
          git pull --rebase origin main
          git push origin HEAD:main
