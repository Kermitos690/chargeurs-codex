name: Protected Return Correlation

on:
  pull_request:
    paths:
      - "supabase/functions/chargenow-rent-callback/**"
      - "supabase/functions/_shared/returnCorrelation.ts"
      - "supabase/functions/tests/chargenow_return_correlation_contract.test.ts"
      - ".github/workflows/protected-return-correlation.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: protected-return-correlation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  return-correlation-contract:
    name: Return correlation contract
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Run Protected Core return tests
        run: deno test --allow-read supabase/functions/tests/chargenow_return_correlation_contract.test.ts
