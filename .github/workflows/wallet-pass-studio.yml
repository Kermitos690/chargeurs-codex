name: Wallet Pass Studio

on:
  pull_request:
    paths:
      - "src/pages/account/AccountPass.tsx"
      - "supabase/functions/customer-wallet-pass/**"
      - "supabase/functions/_shared/passStudio.ts"
      - "supabase/migrations/*pass_studio_wallet_provider.sql"
      - "scripts/check-wallet-pass-studio.mjs"
      - ".github/workflows/wallet-pass-studio.yml"

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Reject committed Pass Studio live keys
        shell: bash
        run: |
          set -euo pipefail
          if git grep -nE 'ps_live_[A-Za-z0-9_-]+' -- . ':!package-lock.json'; then
            echo "::error::A Pass Studio live key is present in tracked source"
            exit 1
          fi

      - name: Provider contract gate
        run: node scripts/check-wallet-pass-studio.mjs

      - name: Frontend lint
        run: npx eslint src/pages/account/AccountPass.tsx

      - name: Typecheck
        run: npm run typecheck

      - name: Production build
        run: npm run build
