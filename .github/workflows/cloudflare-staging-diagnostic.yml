name: Cloudflare staging diagnostic

on:
  workflow_dispatch:
  push:
    branches:
      - feat/cloudflare-staging-20260827
    paths:
      - .github/workflows/cloudflare-staging-diagnostic.yml
      - wrangler.toml
      - functions/api/supabase/**
      - src/integrations/supabase/**
      - src/pages/Account*.tsx

permissions:
  contents: read

jobs:
  public-check:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Wait for Cloudflare deployment and validate Supabase health
        shell: bash
        run: |
          set -euo pipefail
          URL='https://chargeurs-ch-staging-cf.pages.dev/api/supabase/health'
          for attempt in $(seq 1 24); do
            echo "health attempt $attempt"
            RESPONSE="$(curl -sS --max-time 20 -w '\n%{http_code}' "$URL" || true)"
            BODY="$(printf '%s' "$RESPONSE" | sed '$d')"
            STATUS="$(printf '%s' "$RESPONSE" | tail -n1)"
            echo "HTTP $STATUS $BODY"
            if [ "$STATUS" = "200" ] && printf '%s' "$BODY" | grep -q '"ok":true' && printf '%s' "$BODY" | grep -q '"reachable":true' && printf '%s' "$BODY" | grep -q '"upstreamStatus":200'; then
              exit 0
            fi
            sleep 10
          done
          echo 'Supabase health never became ready' >&2
          exit 1

      - name: Validate password-auth transport with deliberate invalid credentials
        shell: bash
        run: |
          set -euo pipefail
          RESPONSE="$(curl -sS --max-time 20 -w '\n%{http_code}' \
            -H 'Content-Type: application/json' \
            -d '{"email":"cloudflare-proxy-probe@example.invalid","password":"definitely-not-a-real-password"}' \
            'https://chargeurs-ch-staging-cf.pages.dev/api/supabase/auth/v1/token?grant_type=password')"
          BODY="$(printf '%s' "$RESPONSE" | sed '$d')"
          STATUS="$(printf '%s' "$RESPONSE" | tail -n1)"
          echo "HTTP $STATUS $BODY"
          test "$STATUS" = "400"
          printf '%s' "$BODY" | grep -Eq 'invalid_credentials|Invalid login credentials'

      - name: Validate account login page
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSIL --max-time 20 https://chargeurs-ch-staging-cf.pages.dev/compte/login >/dev/null

      - name: Volt AI runtime status
        shell: bash
        run: |
          set -euo pipefail
          BODY="$(curl -fsS --max-time 20 https://chargeurs-ch-staging-cf.pages.dev/api/volt-ai-status)"
          echo "$BODY"
          printf '%s' "$BODY" | grep -q '"workersAIReady":true'

      - name: Volt chat provider probe
        shell: bash
        run: |
          set -euo pipefail
          BODY="$(curl -fsS --max-time 30 \
            -H 'Content-Type: application/json' \
            -d '{"mode":"public","message":"Yo-Yo ça va ?","history":[],"locale":"fr"}' \
            https://chargeurs-ch-staging-cf.pages.dev/api/volt-chat)"
          echo "$BODY"
          printf '%s' "$BODY" | grep -q '"ok":true'

  imac-check:
    runs-on: [self-hosted, macOS]
    timeout-minutes: 10
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cloudflare authentication check
        shell: bash
        run: |
          set -euo pipefail
          npx --yes wrangler@4.35.0 whoami

      - name: Pages DNS and HTTP check
        shell: bash
        run: |
          set -euo pipefail
          (dig +short chargeurs-ch-staging-cf.pages.dev || nslookup chargeurs-ch-staging-cf.pages.dev || true)
          curl -fsSIL --max-time 15 https://chargeurs-ch-staging-cf.pages.dev/ || true

