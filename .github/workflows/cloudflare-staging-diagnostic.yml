name: Cloudflare staging diagnostic

on:
  workflow_dispatch:
  push:
    branches:
      - feat/cloudflare-staging-20260827
    paths:
      - .github/workflows/cloudflare-staging-diagnostic.yml
      - wrangler.toml
      - src/integrations/supabase/**
      - src/pages/Account*.tsx
      - functions/api/volt-*.js
      - functions/_shared/volt-knowledge.js

permissions:
  contents: read

jobs:
  public-check:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Wait for Cloudflare deployment and validate account login page
        shell: bash
        run: |
          set -euo pipefail
          URL='https://chargeurs-ch-staging-cf.pages.dev/compte/login'
          for attempt in $(seq 1 24); do
            echo "page attempt $attempt"
            STATUS="$(curl -sS -L --max-time 20 -o /tmp/account.html -w '%{http_code}' "$URL" || true)"
            echo "HTTP $STATUS"
            if [ "$STATUS" = "200" ] && grep -q 'Chargeurs.ch' /tmp/account.html; then
              exit 0
            fi
            sleep 10
          done
          echo 'Cloudflare account page never became ready' >&2
          exit 1

      - name: Validate direct Supabase Auth health and CORS
        shell: bash
        env:
          SUPABASE_URL: https://xqepbqnaenoeyfjkjnzl.supabase.co
          SUPABASE_PUBLISHABLE_KEY: sb_publishable_39LXZ2QrezT20u9dqDQX2Q_-yq4GX0d
          APP_ORIGIN: https://chargeurs-ch-staging-cf.pages.dev
        run: |
          set -euo pipefail
          curl -fsS --max-time 20 \
            -H "apikey: $SUPABASE_PUBLISHABLE_KEY" \
            "$SUPABASE_URL/auth/v1/health" >/tmp/auth-health.json
          cat /tmp/auth-health.json

          curl -sS --max-time 20 -D /tmp/preflight.headers -o /tmp/preflight.body \
            -X OPTIONS \
            -H "Origin: $APP_ORIGIN" \
            -H 'Access-Control-Request-Method: POST' \
            -H 'Access-Control-Request-Headers: apikey,authorization,content-type,x-client-info' \
            "$SUPABASE_URL/auth/v1/token?grant_type=password"
          cat /tmp/preflight.headers
          grep -Eiq '^access-control-allow-origin: (\*|https://chargeurs-ch-staging-cf\.pages\.dev)' /tmp/preflight.headers

      - name: Validate password-auth transport with deliberate invalid credentials
        shell: bash
        env:
          SUPABASE_URL: https://xqepbqnaenoeyfjkjnzl.supabase.co
          SUPABASE_PUBLISHABLE_KEY: sb_publishable_39LXZ2QrezT20u9dqDQX2Q_-yq4GX0d
          APP_ORIGIN: https://chargeurs-ch-staging-cf.pages.dev
        run: |
          set -euo pipefail
          STATUS="$(curl -sS --max-time 20 -D /tmp/auth.headers -o /tmp/auth.body -w '%{http_code}' \
            -H "Origin: $APP_ORIGIN" \
            -H 'Content-Type: application/json' \
            -H "apikey: $SUPABASE_PUBLISHABLE_KEY" \
            -H "Authorization: Bearer $SUPABASE_PUBLISHABLE_KEY" \
            -d '{"email":"cloudflare-browser-probe@example.invalid","password":"definitely-not-a-real-password"}' \
            "$SUPABASE_URL/auth/v1/token?grant_type=password")"
          cat /tmp/auth.headers
          cat /tmp/auth.body
          test "$STATUS" = "400"
          grep -Eq 'invalid_credentials|Invalid login credentials' /tmp/auth.body
          grep -Eiq '^access-control-allow-origin: (\*|https://chargeurs-ch-staging-cf\.pages\.dev)' /tmp/auth.headers

      - name: Volt AI runtime status
        shell: bash
        run: |
          set -euo pipefail
          BODY="$(curl -fsS --max-time 20 https://chargeurs-ch-staging-cf.pages.dev/api/volt-ai-status)"
          echo "$BODY"
          printf '%s' "$BODY" | grep -q '"workersAIReady":true'

      - name: Volt chat provider probe
        shell: bash
        run: |
          set -euo pipefail
          BODY="$(curl -fsS --max-time 30 \
            -H 'Content-Type: application/json' \
            -d '{"mode":"public","message":"Quels sont les tarifs de location ?","history":[],"locale":"fr"}' \
            https://chargeurs-ch-staging-cf.pages.dev/api/volt-chat)"
          echo "$BODY"
          printf '%s' "$BODY" | grep -q '"ok":true'
