name: Chargeurs.ch Kiosk V2 Preview

on:
  push:
    branches:
      - agent/chargenow-local-diagnostics
    paths:
      - "src/**"
      - "public/**"
      - "index.html"
      - "package.json"
      - "package-lock.json"
      - "vite.config.*"
      - ".github/workflows/github-pages-preview.yml"
  pull_request:
    paths:
      - "src/**"
      - "public/**"
      - "index.html"
      - "package.json"
      - "package-lock.json"
      - "vite.config.*"
      - ".github/workflows/github-pages-preview.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: chargeurs-kiosk-v2-preview-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci --legacy-peer-deps --prefer-offline --no-audit --no-fund

      - name: Type-check frontend
        run: npm run typecheck

      - name: Build static Kiosk V2 preview
        env:
          VITE_ROUTER_MODE: hash
        run: npm run build -- --base /chargeurs-codex/

      - name: Upload downloadable preview
        uses: actions/upload-artifact@v6
        with:
          name: chargeurs-kiosk-v2-pages-${{ github.run_number }}
          path: dist
          if-no-files-found: error
          retention-days: 7

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    if: github.event_name != 'pull_request'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy preview
        id: deployment
        uses: actions/deploy-pages@v4
