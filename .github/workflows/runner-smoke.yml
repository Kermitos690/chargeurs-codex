name: Runner smoke

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - feat/chargeurs-platform-api-v1
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Confirm hosted runner starts
        run: |
          echo "runner-ok"
          uname -a
