name: DTA21269 v3 field APK

on:
  workflow_dispatch:
  push:
    branches:
      - hotfix/staging-terminal-cancel-v300
    paths:
      - "android-kiosk/**"
      - ".ci-trigger/dta21269-v3-field-build"
      - ".github/workflows/dta21269-v3-field-build.yml"

permissions:
  contents: read
  issues: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Android SDK
        uses: android-actions/setup-android@v3

      - name: Restore canonical staging signer
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: chargeurs-kiosk-staging-debug-keystore-v1

      - name: Require canonical signer
        shell: bash
        run: |
          set -euo pipefail
          test -s "$HOME/.android/debug.keystore" || {
            echo "Canonical staging signer unavailable; refusing field APK." >&2
            exit 23
          }
          keytool -list -v \
            -keystore "$HOME/.android/debug.keystore" \
            -storepass android \
            -alias androiddebugkey | tee /tmp/staging-keytool.txt
          actual="$(sed -n 's/^[[:space:]]*SHA256: //p' /tmp/staging-keytool.txt | head -1 | tr -d ':' | tr '[:upper:]' '[:lower:]')"
          expected="b37d4cda37c8623259dfc7aa408328b8f2d04911082c46073b6e1b429ba805a3"
          test "$actual" = "$expected"
          printf '%s' "$actual" > /tmp/canonical_staging_signer_sha256

      - name: Gradle setup
        uses: gradle/actions/setup-gradle@v4

      - name: Build physical WisePad v3 staging APK
        working-directory: android-kiosk
        env:
          CHARGEURS_ENROLLMENT_URL: https://xqepbqnaenoeyfjkjnzl.supabase.co/functions/v1/kiosk-enroll
          CHARGEURS_KIOSK_PUBLIC_BASE_URL: https://chargeurs-ch-staging.vercel.app
          CHARGEURS_KIOSK_WEB_BASE_URL: https://chargeurs-ch-staging.vercel.app
          CHARGEURS_STRIPE_TERMINAL_BACKEND_URL: https://xqepbqnaenoeyfjkjnzl.supabase.co/functions/v1/stripe-terminal-backend
          CHARGEURS_STAGING_KEYSTORE_PATH: /home/runner/.android/debug.keystore
          CHARGEURS_STAGING_KEYSTORE_PASSWORD: android
          CHARGEURS_STAGING_KEY_ALIAS: androiddebugkey
          CHARGEURS_STAGING_KEY_PASSWORD: android
        run: ./gradlew --no-daemon clean testDebugUnitTest lintStaging assembleStaging

      - name: Verify field contract
        shell: bash
        run: |
          set -euo pipefail
          apk="android-kiosk/app/build/outputs/apk/staging/app-staging.apk"
          gradle="android-kiosk/app/build.gradle.kts"
          runtime="android-kiosk/app/src/main/java/ch/chargeurs/kiosk/StripeTerminalReaderRuntime.java"
          bridge="android-kiosk/app/src/main/java/ch/chargeurs/kiosk/NativeBridge.java"

          test -s "$apk"
          grep -F 'implementation("com.stripe:stripeterminal:3.0.0")' "$gradle"
          grep -F 'STRIPE_TERMINAL_USB_TEST_ENABLED", "true"' "$gradle"
          grep -F 'HARDWARE_EJECTION_ENABLED", "false"' "$gradle"
          grep -F 'Explicit WisePad retry invalidated stale USB connect/discovery state' "$runtime"
          grep -F 'cancelTerminalPayment()' "$bridge"

          aapt_path="$(find "${ANDROID_HOME}/build-tools" -type f -name aapt -perm -u+x | sort -V | tail -1)"
          apksigner_path="$(find "${ANDROID_HOME}/build-tools" -type f -name apksigner -perm -u+x | sort -V | tail -1)"
          test -n "$aapt_path"
          test -n "$apksigner_path"
          badging="$($aapt_path dump badging "$apk")"
          printf '%s\n' "$badging" | grep -F "package: name='ch.chargeurs.kiosk.staging'"
          printf '%s\n' "$badging" | grep -F "versionCode='151'"
          printf '%s\n' "$badging" | grep -F "versionName='1.0.51-terminal-simulated-reader-restore-staging'"

          "$apksigner_path" verify --verbose --print-certs "$apk" | tee /tmp/apksigner.txt
          cert="$(sed -n 's/^.*certificate SHA-256 digest: //p' /tmp/apksigner.txt | head -1 | tr '[:upper:]' '[:lower:]')"
          test "$cert" = "$(cat /tmp/canonical_staging_signer_sha256)"
          printf '%s' "$cert" > /tmp/apk_signer_sha256

      - name: Package artifact
        id: package
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          src="android-kiosk/app/build/outputs/apk/staging/app-staging.apk"
          name="Chargeurs_CH_Kiosk_1.0.51-terminal-v3-field-reconnect-staging.apk"
          cp "$src" "dist/$name"
          apk_sha="$(sha256sum "dist/$name" | awk '{print $1}')"
          signer_sha="$(cat /tmp/apk_signer_sha256)"
          printf '%s  %s\n' "$apk_sha" "$name" > dist/SHA256SUMS.txt
          printf 'signerCertificateSha256=%s\n' "$signer_sha" > dist/SIGNER.txt
          cat > dist/PROVENANCE.txt <<EOF
          sha=$GITHUB_SHA
          station=DTA21269
          package=ch.chargeurs.kiosk.staging
          versionCode=151
          versionName=1.0.51-terminal-simulated-reader-restore-staging
          environment=STAGING_TEST
          stripeTerminalSdk=3.0.0
          issue=288
          hardwareEjectionEnabled=false
          apkSha256=$apk_sha
          signerCertificateSha256=$signer_sha
          EOF
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "apk_sha=$apk_sha" >> "$GITHUB_OUTPUT"
          echo "signer_sha=$signer_sha" >> "$GITHUB_OUTPUT"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: dta21269-v3-field-apk
          retention-days: 7
          if-no-files-found: error
          path: dist/*

      - name: Report successful field build
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
          APK_NAME: ${{ steps.package.outputs.name }}
          APK_SHA: ${{ steps.package.outputs.apk_sha }}
          SIGNER_SHA: ${{ steps.package.outputs.signer_sha }}
        shell: bash
        run: |
          set -euo pipefail
          body="V3_FIELD_APK_READY run=${GITHUB_RUN_ID} sha=${GITHUB_SHA} apk=${APK_NAME} apkSha256=${APK_SHA} signerSha256=${SIGNER_SHA}"
          gh api --method POST "repos/${GITHUB_REPOSITORY}/issues/288/comments" -f body="$body"
