name: Vercel Prebuilt Production

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vercel-prebuilt-production
  cancel-in-progress: true

env:
  VERCEL_SCOPE: gaetans-projects-4974c31a
  VERCEL_PROJECT: chargeurs-ch-staging
  VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

jobs:
  deploy:
    name: Build on GitHub and deploy prebuilt
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout main
        uses: actions/checkout@v4

      - name: Require Vercel token
        shell: bash
        run: |
          if [ -z "$VERCEL_TOKEN" ]; then
            echo "::error::Missing GitHub Actions secret VERCEL_TOKEN"
            exit 1
          fi

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Link Vercel project
        run: >-
          npx --yes vercel@latest link --yes
          --scope="$VERCEL_SCOPE"
          --project="$VERCEL_PROJECT"
          --token="$VERCEL_TOKEN"

      - name: Pull production environment
        run: >-
          npx --yes vercel@latest pull --yes
          --environment=production
          --scope="$VERCEL_SCOPE"
          --token="$VERCEL_TOKEN"

      - name: Build precompiled production output
        run: >-
          npx --yes vercel@latest build --prod
          --scope="$VERCEL_SCOPE"
          --token="$VERCEL_TOKEN"

      - name: Deploy prebuilt output to production
        run: >-
          npx --yes vercel@latest deploy --prebuilt --prod --yes
          --scope="$VERCEL_SCOPE"
          --token="$VERCEL_TOKEN"
