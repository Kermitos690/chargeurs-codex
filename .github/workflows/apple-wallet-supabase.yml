name: Chargeurs.ch Apple Wallet Supabase

on:
  workflow_dispatch:
    inputs:
      project_ref:
        description: "Supabase project ref explicitly targeted"
        required: true
        default: "zoybkzkvvsbnqqarlaii"
        type: string
      configure_secrets:
        description: "Configure Apple Wallet secrets from encrypted GitHub secrets"
        required: true
        default: false
        type: boolean
      apply_migrations:
        description: "Apply Apple Wallet migrations after dry-run"
        required: true
        default: false
        type: boolean
      deploy_functions:
        description: "Deploy Apple Wallet Edge Functions"
        required: true
        default: false
        type: boolean
      confirmation:
        description: "Required for writes: APPLY_CHARGEURS_APPLE_WALLET"
        required: false
        default: ""
        type: string
  schedule:
    - cron: "*/5 * * * *"

permissions:
  contents: read

concurrency:
  group: chargeurs-apple-wallet-${{ github.event_name }}
  cancel-in-progress: false

jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_REF: ${{ inputs.project_ref }}
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Validate target and explicit write confirmation
        shell: bash
        run: |
          set -euo pipefail
          : > apple-wallet-deploy-report.txt
          for name in SUPABASE_ACCESS_TOKEN SUPABASE_DB_PASSWORD SUPABASE_PROJECT_REF; do
            if [ -z "${!name:-}" ]; then
              echo "Missing required value: $name" >&2
              exit 1
            fi
          done
          if { [ "${{ inputs.configure_secrets }}" = "true" ] || [ "${{ inputs.apply_migrations }}" = "true" ] || [ "${{ inputs.deploy_functions }}" = "true" ]; } \
             && [ "${{ inputs.confirmation }}" != "APPLY_CHARGEURS_APPLE_WALLET" ]; then
            echo "Write operations require the exact confirmation phrase." >&2
            exit 1
          fi
          echo "PROJECT_REF=$SUPABASE_PROJECT_REF" >> apple-wallet-deploy-report.txt
          echo "CONFIGURE_SECRETS=${{ inputs.configure_secrets }}" >> apple-wallet-deploy-report.txt
          echo "APPLY_MIGRATIONS=${{ inputs.apply_migrations }}" >> apple-wallet-deploy-report.txt
          echo "DEPLOY_FUNCTIONS=${{ inputs.deploy_functions }}" >> apple-wallet-deploy-report.txt

      - name: Link selected Supabase project
        run: supabase link --project-ref "$SUPABASE_PROJECT_REF" --password "$SUPABASE_DB_PASSWORD"

      - name: Inspect and dry-run migrations
        shell: bash
        run: |
          set -euo pipefail
          supabase migration list --linked --password "$SUPABASE_DB_PASSWORD" | tee migration-list-before.txt
          supabase db push --linked --password "$SUPABASE_DB_PASSWORD" --include-all --dry-run | tee migration-dry-run.txt

      - name: Configure encrypted Apple Wallet secrets
        if: inputs.configure_secrets == true
        env:
          APPLE_PASS_TYPE_IDENTIFIER: ${{ secrets.APPLE_PASS_TYPE_IDENTIFIER }}
          APPLE_TEAM_IDENTIFIER: ${{ secrets.APPLE_TEAM_IDENTIFIER }}
          APPLE_PASS_WEB_SERVICE_URL: ${{ secrets.APPLE_PASS_WEB_SERVICE_URL }}
          APPLE_PASS_SIGNER_CERTIFICATE_BASE64: ${{ secrets.APPLE_PASS_SIGNER_CERTIFICATE_BASE64 }}
          APPLE_PASS_SIGNER_KEY_BASE64: ${{ secrets.APPLE_PASS_SIGNER_KEY_BASE64 }}
          APPLE_PASS_SIGNER_KEY_PASSPHRASE: ${{ secrets.APPLE_PASS_SIGNER_KEY_PASSPHRASE }}
          APPLE_WWDR_CERTIFICATE_BASE64: ${{ secrets.APPLE_WWDR_CERTIFICATE_BASE64 }}
          APPLE_WALLET_APNS_KEY_ID: ${{ secrets.APPLE_WALLET_APNS_KEY_ID }}
          APPLE_WALLET_APNS_PRIVATE_KEY_BASE64: ${{ secrets.APPLE_WALLET_APNS_PRIVATE_KEY_BASE64 }}
          APPLE_WALLET_APNS_ENVIRONMENT: ${{ secrets.APPLE_WALLET_APNS_ENVIRONMENT }}
          WALLET_TOKEN_ENCRYPTION_KEY: ${{ secrets.WALLET_TOKEN_ENCRYPTION_KEY }}
          WALLET_PUSH_JOB_SECRET: ${{ secrets.WALLET_PUSH_JOB_SECRET }}
          PUBLIC_APP_URL: ${{ secrets.PUBLIC_APP_URL }}
        shell: bash
        run: |
          set -euo pipefail
          required=(
            APPLE_PASS_TYPE_IDENTIFIER APPLE_TEAM_IDENTIFIER APPLE_PASS_WEB_SERVICE_URL
            APPLE_PASS_SIGNER_CERTIFICATE_BASE64 APPLE_PASS_SIGNER_KEY_BASE64
            APPLE_WWDR_CERTIFICATE_BASE64 APPLE_WALLET_APNS_KEY_ID
            APPLE_WALLET_APNS_PRIVATE_KEY_BASE64 WALLET_TOKEN_ENCRYPTION_KEY
            WALLET_PUSH_JOB_SECRET PUBLIC_APP_URL
          )
          for name in "${required[@]}"; do
            if [ -z "${!name:-}" ]; then echo "Missing encrypted GitHub secret: $name" >&2; exit 1; fi
          done
          supabase secrets set --project-ref "$SUPABASE_PROJECT_REF" \
            APPLE_PASS_TYPE_IDENTIFIER="$APPLE_PASS_TYPE_IDENTIFIER" \
            APPLE_TEAM_IDENTIFIER="$APPLE_TEAM_IDENTIFIER" \
            APPLE_PASS_WEB_SERVICE_URL="$APPLE_PASS_WEB_SERVICE_URL" \
            APPLE_PASS_SIGNER_CERTIFICATE_BASE64="$APPLE_PASS_SIGNER_CERTIFICATE_BASE64" \
            APPLE_PASS_SIGNER_KEY_BASE64="$APPLE_PASS_SIGNER_KEY_BASE64" \
            APPLE_PASS_SIGNER_KEY_PASSPHRASE="$APPLE_PASS_SIGNER_KEY_PASSPHRASE" \
            APPLE_WWDR_CERTIFICATE_BASE64="$APPLE_WWDR_CERTIFICATE_BASE64" \
            APPLE_WALLET_APNS_KEY_ID="$APPLE_WALLET_APNS_KEY_ID" \
            APPLE_WALLET_APNS_PRIVATE_KEY_BASE64="$APPLE_WALLET_APNS_PRIVATE_KEY_BASE64" \
            APPLE_WALLET_APNS_ENVIRONMENT="${APPLE_WALLET_APNS_ENVIRONMENT:-production}" \
            WALLET_TOKEN_ENCRYPTION_KEY="$WALLET_TOKEN_ENCRYPTION_KEY" \
            WALLET_PUSH_JOB_SECRET="$WALLET_PUSH_JOB_SECRET" \
            PUBLIC_APP_URL="$PUBLIC_APP_URL"
          echo "SECRETS_CONFIGURED=true" >> apple-wallet-deploy-report.txt

      - name: Apply migrations
        if: inputs.apply_migrations == true
        shell: bash
        run: |
          set -euo pipefail
          supabase db push --linked --password "$SUPABASE_DB_PASSWORD" --include-all --yes | tee migration-push.txt
          supabase migration list --linked --password "$SUPABASE_DB_PASSWORD" | tee migration-list-after.txt
          grep -q "20260716010000" migration-list-after.txt
          grep -q "20260716011000" migration-list-after.txt
          grep -q "20260716012000" migration-list-after.txt
          supabase db lint --linked --schema public --level error --fail-on error | tee database-lint.txt
          echo "MIGRATIONS_APPLIED=true" >> apple-wallet-deploy-report.txt

      - name: Deploy Apple Wallet Edge Functions
        if: inputs.deploy_functions == true
        shell: bash
        run: |
          set -euo pipefail
          for function_name in \
            apple-wallet-pass \
            apple-wallet-web-service \
            wallet-link \
            wallet-admin \
            wallet-push-updates; do
            supabase functions deploy "$function_name" --project-ref "$SUPABASE_PROJECT_REF" --no-verify-jwt --use-api
          done
          echo "FUNCTIONS_DEPLOYED=true" >> apple-wallet-deploy-report.txt

      - name: Upload sanitized deployment diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: apple-wallet-supabase-deploy
          path: |
            apple-wallet-deploy-report.txt
            migration-list-before.txt
            migration-dry-run.txt
            migration-push.txt
            migration-list-after.txt
            database-lint.txt
          if-no-files-found: ignore
          retention-days: 7

  push-updates:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Notify registered Wallet devices
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          WALLET_PUSH_JOB_SECRET: ${{ secrets.WALLET_PUSH_JOB_SECRET }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$SUPABASE_URL"
          test -n "$WALLET_PUSH_JOB_SECRET"
          response=$(curl --fail-with-body --silent --show-error \
            --request POST \
            --header "Authorization: Bearer $WALLET_PUSH_JOB_SECRET" \
            --header "Content-Type: application/json" \
            --data '{}' \
            "$SUPABASE_URL/functions/v1/wallet-push-updates")
          echo "$response" | jq -e '.ok == true'
