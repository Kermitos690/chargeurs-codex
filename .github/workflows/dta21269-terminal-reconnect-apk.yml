name: DTA21269 Terminal reconnect APK

on:
  push:
    branches:
      - hotfix/p0-dta21269-terminal-reconnect-20260818
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v5
      - name: Build staging APK
        working-directory: android-kiosk
        env:
          CHARGEURS_ENROLLMENT_URL: https://xqepbqnaenoeyfjkjnzl.supabase.co/functions/v1/kiosk-enroll
          CHARGEURS_KIOSK_PUBLIC_BASE_URL: https://chargeurs-ch-staging.vercel.app
          CHARGEURS_KIOSK_WEB_BASE_URL: https://chargeurs-ch-staging.vercel.app
          CHARGEURS_STRIPE_TERMINAL_BACKEND_URL: https://xqepbqnaenoeyfjkjnzl.supabase.co/functions/v1/stripe-terminal-backend
        run: ./gradlew --no-daemon clean testDebugUnitTest lintStaging assembleStaging
      - name: Verify P0 invariants
        shell: bash
        run: |
          set -euo pipefail
          test -s android-kiosk/app/build/outputs/apk/staging/app-staging.apk
          grep -F 'versionCode = 130' android-kiosk/app/build.gradle.kts
          grep -F 'implementation("com.stripe:stripeterminal:2.23.4")' android-kiosk/app/build.gradle.kts
          grep -F 'SDK_COMPAT = "2.23.4-test-only"' android-kiosk/app/src/main/java/ch/chargeurs/kiosk/StripeTerminalReaderRuntime.java
          grep -F 'void requestReconnect()' android-kiosk/app/src/main/java/ch/chargeurs/kiosk/StripeTerminalReaderRuntime.java
          grep -F 'buildConfigField("boolean", "HARDWARE_EJECTION_ENABLED", "false")' android-kiosk/app/build.gradle.kts
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: dta21269-terminal-reconnect-apk
          retention-days: 7
          if-no-files-found: error
          path: android-kiosk/app/build/outputs/apk/staging/app-staging.apk
