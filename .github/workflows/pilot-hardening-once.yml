name: Pilot hardening patch

on:
  push:
    branches:
      - main
    paths:
      - .deploy/pilot-hardening-trigger

permissions:
  contents: write

jobs:
  patch-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Apply deterministic pilot safeguards
        run: python .github/scripts/pilot_patch.py

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Build production bundle
        run: npm run build

      - name: Commit validated patch
        run: |
          if git diff --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git config user.name "chargeurs-pilot-bot"
          git config user.email "actions@users.noreply.github.com"
          git add src/pages/Kiosk.tsx src/pages/KioskPremiumGateV2.tsx supabase/functions/_shared/customerPairing.ts supabase/functions/kiosk-cabinet-snapshot/index.ts
          git commit -m "fix(pilot): make QR cancellation safe and return home cleanly"
          git push origin HEAD:main
