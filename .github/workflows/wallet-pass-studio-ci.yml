name: Wallet Pass Studio CI

on:
  pull_request:
    paths:
      - "src/pages/account/AccountPass.tsx"
      - "src/pages/account/accountData.ts"
      - "supabase/functions/account-privacy/**"
      - "supabase/functions/noop/**"
      - "supabase/functions/_shared/passStudio.ts"
      - "supabase/functions/_shared/passStudioWallet.ts"
      - "supabase/migrations/*wallet*.sql"
      - "scripts/check-wallet-pass-studio.mjs"
      - ".github/workflows/wallet-pass-studio-ci.yml"
      - "package.json"
      - "package-lock.json"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: wallet-pass-studio-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: No Pass Studio secret in source
        shell: bash
        run: |
          set -euo pipefail
          if git grep -nE 'ps_live_[A-Za-z0-9_-]+' -- . ':!package-lock.json'; then
            echo "::error::A Pass Studio live key is present in tracked source"
            exit 1
          fi
      - name: Wallet provider and realtime contract
        run: node scripts/check-wallet-pass-studio.mjs
      - name: TypeScript
        run: npm run typecheck
      - name: Frontend tests
        run: npm test
      - name: Production build
        run: npm run build
