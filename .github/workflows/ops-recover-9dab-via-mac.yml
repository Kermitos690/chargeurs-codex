name: Recover DTA21269 Terminal authorization once

on:
  push:
    branches:
      - ops/chargeurs-mac-remote
    paths:
      - .github/workflows/ops-recover-9dab-via-mac.yml

permissions:
  contents: read

concurrency:
  group: recover-dta21269-9dab-once
  cancel-in-progress: false

jobs:
  recover:
    runs-on: [self-hosted, macOS, chargeurs-adb]
    timeout-minutes: 5
    steps:
      - name: Recover exact authorized staging rental
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ops-output
          url='https://xqepbqnaenoeyfjkjnzl.supabase.co/functions/v1/ops-recover-current-manual-card-once?permit=recover-9dab-card-present-20260822-v1'
          curl --fail-with-body --silent --show-error --max-time 30 "$url" | tee ops-output/recovery.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          data=json.loads(Path('ops-output/recovery.json').read_text())
          if data.get('ok') is not True:
              raise SystemExit(f"recovery rejected: {data}")
          print('RECOVERY_OK', data)
          PY

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: recover-dta21269-9dab-${{ github.run_id }}
          retention-days: 2
          if-no-files-found: error
          path: ops-output/recovery.json
