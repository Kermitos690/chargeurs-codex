name: Kiosk UX physical QA

on:
  pull_request:
    paths:
      - "src/main.tsx"
      - "src/pwa/nativeKioskBootstrap.ts"
      - "src/lib/kioskEdgeProxy.ts"
      - "src/pages/KioskHome.tsx"
      - "src/pages/KioskPremiumGateV3.tsx"
      - "src/pages/kiosk-production-*.css"
      - "src/pages/kiosk-v3-owned-home.css"
      - "src/components/kiosk/PowerbankScene.tsx"
      - "src/components/kiosk/KioskDiagnostics.tsx"
      - "src/components/kiosk/KioskHelpLauncher.tsx"
      - "src/components/kiosk/KioskOffersLauncher.tsx"
      - "src/components/kiosk/KioskV3AuthGuard.tsx"
      - "src/components/kiosk/KioskV3HomeChrome.tsx"
      - "src/components/kiosk/KioskV3OwnedHome.tsx"
      - "src/components/kiosk/KioskV3JourneyChrome.tsx"
      - "src/components/kiosk/KioskV3CinematicDirector.tsx"
      - "src/components/kiosk/KioskV3PricingRecovery.tsx"
      - "src/components/kiosk/KioskV3TouchFeedback.tsx"
      - "src/test/kioskUxRecovery.test.ts"
      - "docs/kiosk-ux-p1-recovery-*.md"
      - "docs/chargeurs-cinematic-kiosk-direction.md"
      - "docs/agent4-kiosk-auth-failsafe-plan.md"
      - ".github/workflows/kiosk-ux-physical-qa.yml"

permissions:
  contents: read

jobs:
  typecheck-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Typecheck Agent 4 surface
        shell: bash
        run: |
          set +e
          npm run typecheck 2>&1 | tee /tmp/chargeurs-typecheck.log
          typecheck_exit=${PIPESTATUS[0]}
          set -e

          if grep -E 'src/(main\.tsx|pwa/nativeKioskBootstrap\.ts|lib/kioskEdgeProxy\.ts|components/kiosk/(PowerbankScene|KioskDiagnostics|KioskHelpLauncher|KioskOffersLauncher|KioskV3AuthGuard|KioskV3HomeChrome|KioskV3OwnedHome|KioskV3JourneyChrome|KioskV3CinematicDirector|KioskV3PricingRecovery|KioskV3TouchFeedback)\.tsx|pages/(KioskHome|KioskPremiumGateV3)\.tsx|test/kioskUxRecovery\.test\.ts)' /tmp/chargeurs-typecheck.log; then
            echo "::error::TypeScript regression detected in Agent 4 kiosk UX files"
            exit 1
          fi

          if [ "$typecheck_exit" -ne 0 ]; then
            echo "::warning::Repository baseline type errors remain outside the Agent 4 change surface"
          fi

      - name: Kiosk recovery contract tests
        run: npx vitest run src/test/kioskUxRecovery.test.ts

      - name: Production build
        run: npm run build
