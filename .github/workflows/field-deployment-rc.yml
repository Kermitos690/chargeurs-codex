name: Field Deployment RC

on:
  push:
    branches:
      - codex/field-deployment-v1
  pull_request:
    branches:
      - agent/finalize-chargeurs-platform
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: field-rc-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web-and-edge-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Web unit tests
        run: npm test

      - name: Production web build
        run: npm run build

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Cabinet telemetry, callback and physical-release contracts
        run: >-
          deno test --allow-env --allow-net --allow-read --no-check
          supabase/functions/tests/cabinet_snapshot.test.ts
          supabase/functions/tests/chargenow_callback_auth.test.ts
          supabase/functions/tests/kiosk_cors_contract.test.ts
          supabase/functions/tests/release_observation.test.ts
          supabase/functions/tests/customer_pairing.test.ts

      - name: Record tested SHA
        run: |
          echo "FIELD_RC_TESTED_SHA=${GITHUB_SHA}"
          echo "FIELD_RC_REF=${GITHUB_REF}"

  android-staging-rc:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
          cache-dependency-path: android-kiosk/**/*.gradle*

      - name: Prepare Gradle wrapper
        run: chmod +x android-kiosk/gradlew

      - name: Android unit tests and staging lint
        working-directory: android-kiosk
        run: ./gradlew testStagingUnitTest lintStaging --stacktrace

      - name: Build staging RC APK
        working-directory: android-kiosk
        run: ./gradlew assembleStaging --stacktrace

      - name: Record APK identity
        run: |
          APK="$(find android-kiosk/app/build/outputs/apk/staging -name '*.apk' -type f | head -n 1)"
          test -n "$APK"
          sha256sum "$APK" | tee android-kiosk/APK_SHA256.txt
          echo "FIELD_RC_TESTED_SHA=${GITHUB_SHA}" | tee android-kiosk/BUILD_IDENTITY.txt
          echo "APK_PATH=$APK" | tee -a android-kiosk/BUILD_IDENTITY.txt
          echo "APK_VERSION=1.0.16-rc1-staging" | tee -a android-kiosk/BUILD_IDENTITY.txt
          echo "APK_VERSION_CODE=116" | tee -a android-kiosk/BUILD_IDENTITY.txt
          echo "SIGNATURE_TYPE=debug/test-only" | tee -a android-kiosk/BUILD_IDENTITY.txt

      - name: Upload staging RC APK
        uses: actions/upload-artifact@v4
        with:
          name: chargeurs-kiosk-1.0.16-rc1-staging-${{ github.sha }}
          path: |
            android-kiosk/app/build/outputs/apk/staging/*.apk
            android-kiosk/APK_SHA256.txt
            android-kiosk/BUILD_IDENTITY.txt
          if-no-files-found: error
          retention-days: 14
