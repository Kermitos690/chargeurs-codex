name: ChargeNow Readonly Transition CI

on:
  pull_request:
    paths:
      - "src/pages/admin/AdminMaintenance.tsx"
      - "supabase/functions/chargenow-readonly-audit/**"
      - "supabase/functions/_shared/chargenowReadonlySnapshot.ts"
      - "supabase/functions/tests/chargenow_readonly_snapshot.test.ts"
      - "supabase/config.toml"
      - ".env.example"
      - ".github/workflows/chargenow-readonly-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: chargenow-readonly-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install frontend dependencies
        run: npm ci --legacy-peer-deps --prefer-offline --no-audit --no-fund

      - name: Type-check frontend
        run: npm run typecheck

      - name: Build frontend
        run: npm run build

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Check read-only provider function
        run: >-
          deno check --allow-import
          supabase/functions/chargenow-readonly-audit/index.ts
          supabase/functions/_shared/chargenowReadonlySnapshot.ts

      - name: Run snapshot normalization tests
        run: >-
          deno test --allow-env --allow-net --no-check
          supabase/functions/tests/chargenow_readonly_snapshot.test.ts
