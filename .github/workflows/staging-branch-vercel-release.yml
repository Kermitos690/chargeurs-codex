name: STAGING branch Vercel release

on:
  push:
    branches:
      - agent/kiosk-wisepad3-stripe-terminal-usb
    paths:
      - .deploy/staging-branch-release-trigger

permissions:
  contents: read

jobs:
  deploy-staging:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout branch HEAD
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Verify Vercel credentials
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          test -n "$VERCEL_TOKEN" || { echo "VERCEL_TOKEN is not configured"; exit 21; }
          test -n "$VERCEL_ORG_ID" || { echo "VERCEL_ORG_ID is not configured"; exit 22; }
          test -n "$VERCEL_PROJECT_ID" || { echo "VERCEL_PROJECT_ID is not configured"; exit 23; }

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Typecheck and build branch frontend
        run: |
          npm run typecheck
          npm run build

      - name: Link STAGING Vercel project
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          mkdir -p .vercel
          printf '{"orgId":"%s","projectId":"%s"}\n' "$VERCEL_ORG_ID" "$VERCEL_PROJECT_ID" > .vercel/project.json

      - name: Pull STAGING stable environment
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: npx --yes vercel@latest pull --yes --environment=production --token="$VERCEL_TOKEN"

      - name: Build STAGING stable deployment
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: npx --yes vercel@latest build --prod --token="$VERCEL_TOKEN"

      - name: Deploy branch HEAD to STAGING stable alias
        id: deploy
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          URL=$(npx --yes vercel@latest deploy --prebuilt --prod --token="$VERCEL_TOKEN")
          echo "deployment_url=$URL" >> "$GITHUB_OUTPUT"
          echo "STAGING deployment: $URL"

      - name: Verify stable STAGING frontend
        run: |
          for i in 1 2 3 4 5; do
            BODY=$(curl -fsSL --max-time 20 https://chargeurs-ch-staging.vercel.app/ || true)
            if printf '%s' "$BODY" | grep -q '<div id="root"'; then
              echo "chargeurs-ch-staging.vercel.app reachable"
              exit 0
            fi
            sleep 5
          done
          echo "Stable STAGING domain did not become reachable" >&2
          exit 31
