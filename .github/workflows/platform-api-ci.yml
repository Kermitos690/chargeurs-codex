name: Chargeurs.ch Platform API CI

on:
  pull_request:
    branches: [main]
    paths:
      - "supabase/functions/platform-api/**"
      - "supabase/functions/platform-api-rentals/**"
      - "supabase/functions/platform-api-stations/**"
      - "supabase/functions/platform-api-webhook-worker/**"
      - "supabase/functions/api-key-admin/**"
      - "supabase/functions/api-webhook-admin/**"
      - "supabase/functions/create-stripe-checkout/**"
      - "supabase/functions/stripe-payment-lifecycle/**"
      - "supabase/functions/sync-cabinet-status/**"
      - "supabase/functions/_shared/platformApi.ts"
      - "supabase/functions/_shared/platformApiMutations.ts"
      - "supabase/functions/_shared/platformApiRouting.ts"
      - "supabase/functions/_shared/platformRentalApi.ts"
      - "supabase/functions/_shared/platformWebhooks.ts"
      - "supabase/functions/_shared/stationSync.ts"
      - "supabase/functions/_shared/paymentLifecycle.ts"
      - "supabase/functions/tests/platform_api*.test.ts"
      - "supabase/functions/tests/platform_webhooks.test.ts"
      - "supabase/functions/tests/station_sync.test.ts"
      - "supabase/functions/tests/payment_lifecycle.test.ts"
      - "supabase/migrations/20260715110000_platform_api_v1.sql"
      - "supabase/migrations/20260715123000_platform_api_mutations.sql"
      - "supabase/migrations/20260715133000_platform_api_webhooks.sql"
      - "supabase/migrations/20260715133500_platform_api_webhook_resilience.sql"
      - "supabase/migrations/20260715170000_payment_authorization_lifecycle.sql"
      - "docs/API_V1.md"
      - "docs/API_WEBHOOKS_V1.md"
      - "docs/PAYMENT_AUTHORIZATION_FLOW.md"
      - "docs/openapi/chargeurs-api-v1.yaml"
      - "docs/openapi/chargeurs-api-actions-v1.yaml"
      - ".github/workflows/platform-api-ci.yml"
  push:
    branches: [feat/chargeurs-platform-api-v1]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Lint application
        run: npm run lint -- --quiet

      - name: Typecheck application
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Production build
        run: npm run build

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Platform API helper tests
        run: |
          deno test --allow-env --no-check supabase/functions/tests/platform_api.test.ts
          deno test --allow-env --no-check supabase/functions/tests/platform_api_mutations.test.ts
          deno test --allow-env --no-check supabase/functions/tests/platform_webhooks.test.ts
          deno test --allow-env --no-check supabase/functions/tests/station_sync.test.ts
          deno test --allow-env --no-check supabase/functions/tests/payment_lifecycle.test.ts

      - name: Check Platform API functions
        run: |
          deno check supabase/functions/platform-api/index.ts
          deno check supabase/functions/platform-api-rentals/index.ts
          deno check supabase/functions/platform-api-stations/index.ts
          deno check supabase/functions/platform-api-webhook-worker/index.ts
          deno check supabase/functions/api-key-admin/index.ts
          deno check supabase/functions/api-webhook-admin/index.ts
          deno check supabase/functions/create-stripe-checkout/index.ts
          deno check supabase/functions/stripe-payment-lifecycle/index.ts
          deno check supabase/functions/sync-cabinet-status/index.ts

      - name: Validate OpenAPI contracts
        run: |
          npx --yes @redocly/cli@1.27.2 lint docs/openapi/chargeurs-api-v1.yaml
          npx --yes @redocly/cli@1.27.2 lint docs/openapi/chargeurs-api-actions-v1.yaml
