name: WisePad USB Diagnostic APK

on:
  pull_request:
    paths:
      - "tools/wisepad-usb-diagnostic/**"
      - ".github/workflows/wisepad-usb-diagnostic.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: wisepad-usb-diagnostic-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Build read-only diagnostic APK
        run: |
          chmod +x android-kiosk/gradlew
          android-kiosk/gradlew -p tools/wisepad-usb-diagnostic :app:lintDebug :app:assembleDebug

      - name: SHA-256
        run: sha256sum tools/wisepad-usb-diagnostic/app/build/outputs/apk/debug/app-debug.apk | tee wisepad-usb-diagnostic.sha256

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Chargeurs-WisePad-USB-Diagnostic-v1.0.0
          path: |
            tools/wisepad-usb-diagnostic/app/build/outputs/apk/debug/app-debug.apk
            wisepad-usb-diagnostic.sha256
          if-no-files-found: error
          retention-days: 7
