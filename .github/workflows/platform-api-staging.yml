# Platform API v1 — staging only.
# Manual, dry-run-by-default workflow for a dedicated Supabase staging project.
# It never runs automatically and never triggers Stripe, ChargeNow or hardware mutations.

name: Platform API staging

on:
  workflow_dispatch:
    inputs:
      target:
        description: "Environment (staging only)"
        type: choice
        options: [staging]
        default: staging
      apply_migration:
        description: "Prepare the staging migration command"
        type: boolean
        default: false
      run_deno_tests:
        description: "Run Platform API tests"
        type: boolean
        default: true
      call_live_apis:
        description: "Call live Stripe/ChargeNow (must remain false)"
        type: boolean
        default: false
      trigger_hardware_ejection:
        description: "Trigger hardware ejection (must remain false)"
        type: boolean
        default: false
      dry_run:
        description: "Dry-run only"
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: platform-api-staging
  cancel-in-progress: true

jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - name: Refuse forbidden toggles
        shell: bash
        run: |
          set -euo pipefail
          [[ "${{ inputs.target }}" == "staging" ]] || { echo "Only staging is supported"; exit 1; }
          [[ "${{ inputs.call_live_apis }}" == "false" ]] || { echo "Live API calls are forbidden"; exit 1; }
          [[ "${{ inputs.trigger_hardware_ejection }}" == "false" ]] || { echo "Hardware ejection is forbidden"; exit 1; }
          [[ "${{ inputs.dry_run }}" == "true" ]] || { echo "This workflow is dry-run only"; exit 1; }
          echo "Safety guard passed"

  validate:
    needs: guard
    if: ${{ inputs.run_deno_tests }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci --legacy-peer-deps --prefer-offline --no-audit --no-fund
      - name: Validate OpenAPI
        run: node --input-type=module -e "import fs from 'node:fs'; import yaml from 'js-yaml'; const doc=yaml.load(fs.readFileSync('docs/openapi/chargeurs-api-v1.yaml','utf8')); if(doc?.openapi !== '3.1.0') throw new Error('OpenAPI 3.1.0 required');"
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Check and test read-only functions
        run: |
          deno check --allow-import \
            supabase/functions/platform-api/index.ts \
            supabase/functions/api-key-admin/index.ts \
            supabase/functions/_shared/platformApi.ts \
            supabase/functions/_shared/apiClientAdmin.ts
          deno test --allow-env --allow-net --no-check \
            supabase/functions/tests/platform_api.test.ts \
            supabase/functions/tests/api_client_admin.test.ts
      - name: Show dry-run migration plan
        if: ${{ inputs.apply_migration }}
        run: |
          echo "DRY RUN ONLY"
          echo "Migration prepared: supabase/migrations/20260719133000_platform_api_readonly_v1.sql"
          echo "No database command was executed."
