name: Direct Vercel kiosk release

on:
  push:
    branches:
      - main
    paths:
      - .deploy/direct-vercel-kiosk-release

permissions:
  contents: write

jobs:
  deploy-production:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      VERCEL_ORG_ID: team_abDGf3iEKUokzMPUB580flN0
      VERCEL_PROJECT_ID: prj_2LXcZhvgaFe1sJp76xX05S3iQazM
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Verify Vercel credentials
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          test -n "$VERCEL_TOKEN" || { echo "VERCEL_TOKEN is not configured"; exit 21; }
          test -n "$VERCEL_ORG_ID" || { echo "VERCEL_ORG_ID is not configured"; exit 22; }
          test -n "$VERCEL_PROJECT_ID" || { echo "VERCEL_PROJECT_ID is not configured"; exit 23; }

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Typecheck and build
        run: |
          npm run typecheck
          npm run build

      - name: Link Vercel project
        run: |
          mkdir -p .vercel
          printf '{"orgId":"%s","projectId":"%s"}\n' "$VERCEL_ORG_ID" "$VERCEL_PROJECT_ID" > .vercel/project.json

      - name: Pull production environment
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: npx --yes vercel@latest pull --yes --environment=production --token="$VERCEL_TOKEN"

      - name: Build prebuilt deployment
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: npx --yes vercel@latest build --prod --token="$VERCEL_TOKEN"

      - name: Deploy prebuilt production
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: npx --yes vercel@latest deploy --prebuilt --prod --token="$VERCEL_TOKEN"

      - name: Record deployment result
        if: always()
        run: |
          mkdir -p .deploy
          printf 'status=%s\nsource_commit=%s\ncompleted_at=%s\n' "${{ job.status }}" "${{ github.sha }}" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > .deploy/direct-vercel-kiosk-release-status
          git config user.name "chargeurs-deploy-bot"
          git config user.email "actions@users.noreply.github.com"
          git add .deploy/direct-vercel-kiosk-release-status
          git commit -m "chore(deploy): record direct Vercel release ${{ job.status }}" || exit 0
          git pull --rebase origin main
          git push origin HEAD:main
