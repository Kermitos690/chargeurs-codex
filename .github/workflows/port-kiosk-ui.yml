name: Port kiosk UI integration

on:
  push:
    branches:
      - codex/field-deployment-v1
    paths:
      - .github/workflows/port-kiosk-ui.yml

permissions:
  contents: write

jobs:
  port:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout RC branch
        uses: actions/checkout@v4
        with:
          ref: codex/field-deployment-v1
          fetch-depth: 0

      - name: Wire FAQ, payment marks and physical slot layout
        shell: python
        run: |
          from pathlib import Path

          path = Path("src/pages/Kiosk.tsx")
          text = path.read_text()

          replacements = [
              (
                  '  ShieldCheck, Smartphone, Clock, RefreshCw, Lock, HelpCircle, CreditCard,\n  Zap,',
                  '  ShieldCheck, Smartphone, Clock, RefreshCw, Lock, HelpCircle,\n  Zap,',
                  'remove obsolete CreditCard icon import',
              ),
              (
                  'import { KioskHolographicFloor, PowerbankScene, SlotReleaseScene } from "@/components/kiosk/PowerbankScene";\n',
                  'import { KioskHolographicFloor, PowerbankScene, SlotReleaseScene } from "@/components/kiosk/PowerbankScene";\nimport { KioskPaymentMarks } from "@/components/kiosk/KioskPaymentMarks";\n',
                  'import payment marks',
              ),
              (
                  '            onClick={() => setShowHelp(true)}\n',
                  '            onClick={() => window.dispatchEvent(new CustomEvent("chargeurs:open-kiosk-help"))}\n',
                  'open canonical FAQ center',
              ),
              (
                  '                  <div className="mt-5 flex flex-wrap gap-3">\n                    {["TWINT", "Apple Pay", "Google Pay", "Link", t("kiosk.qr.card")].map((method) => <span key={method} className="inline-flex items-center gap-2 rounded-full border border-white/20 bg-white/10 px-4 py-2 text-lg font-bold"><CreditCard className="h-4 w-4 text-cyan-200" />{method}</span>)}\n                  </div>',
                  '                  <div className="mt-5">\n                    <KioskPaymentMarks cardLabel={t("kiosk.qr.card")} />\n                  </div>',
                  'replace text payment pills with branded marks',
              ),
              (
                  '                {Array.from({ length: 4 }, (_, index) => slots.find((slot) => slot.slot_num === index + 1) ?? {\n                  slot_num: index + 1, charge_percent: null, rentable: false, confidence: "low" as const, status: "checking" as const, recommended: false,\n                }).map((slot, index) => {',
                  '                {([1, 3, 2, 4] as const).map((physicalSlotNum) => slots.find((slot) => slot.slot_num === physicalSlotNum) ?? {\n                  slot_num: physicalSlotNum, charge_percent: null, rentable: false, confidence: "low" as const, status: "checking" as const, recommended: false,\n                }).map((slot, index) => {',
                  'map physical slots 1/3 over 2/4',
              ),
              (
                  '                  <h1 className={`font-display font-extrabold leading-tight ${splitLayoutPreview ? "text-3xl" : "text-4xl sm:text-5xl"}`}>{t("kiosk.choose.title")}</h1>',
                  '                  <h1 className={`font-display font-black leading-[.95] tracking-tight ${splitLayoutPreview ? "text-4xl" : "text-5xl sm:text-7xl"}`}>{t("kiosk.choose.title")}</h1>',
                  'increase idle hero typography',
              ),
              (
                  '                  <p className={`${splitLayoutPreview ? "text-base" : "text-lg sm:text-xl"} text-muted-foreground`}>{t("kiosk.choose.subtitle")}</p>',
                  '                  <p className={`${splitLayoutPreview ? "text-lg" : "text-xl sm:text-2xl"} max-w-4xl font-medium text-muted-foreground`}>{t("kiosk.choose.subtitle")}</p>',
                  'increase idle subtitle typography',
              ),
              (
                  '                    className={`kiosk-slot-card glass liquid-border relative min-h-44 rounded-3xl p-4 text-left transition',
                  '                    className={`kiosk-slot-card glass liquid-border relative min-h-52 rounded-3xl p-5 text-left transition',
                  'increase slot touch targets',
              ),
              (
                  '                    <div className="text-base font-bold text-foreground/90">{t("kiosk.slot.label", { slot: slot.slot_num })}</div>',
                  '                    <div className="text-xl font-black text-foreground/90">{t("kiosk.slot.label", { slot: slot.slot_num })}</div>',
                  'increase slot labels',
              ),
              (
                  '                      <div className="mt-2 text-4xl font-extrabold tracking-tight">{`${Math.round(slot.charge_percent)}%`}</div>',
                  '                      <div className="mt-2 text-5xl font-black tracking-tight">{`${Math.round(slot.charge_percent)}%`}</div>',
                  'increase battery percentage',
              ),
          ]

          for old, new, label in replacements:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected exactly 1 match, got {count}")
              text = text.replace(old, new, 1)

          path.write_text(text)

      - name: Verify no old payment pills remain
        run: |
          grep -q 'KioskPaymentMarks' src/pages/Kiosk.tsx
          grep -q '\[1, 3, 2, 4\] as const' src/pages/Kiosk.tsx
          ! grep -q '\["TWINT", "Apple Pay", "Google Pay", "Link"' src/pages/Kiosk.tsx

      - name: Commit ported kiosk UI
        run: |
          git config user.name "chargeurs-rc-bot"
          git config user.email "actions@users.noreply.github.com"
          git add src/pages/Kiosk.tsx
          git commit -m "feat: wire kiosk FAQ, payment marks and physical slot map"
          git push origin HEAD:codex/field-deployment-v1
