name: Chargeurs.ch Settlement Supabase Gate

on:
  workflow_dispatch:
    inputs:
      project_ref:
        description: "Dedicated non-production Supabase project ref"
        required: true
        default: ""
        type: string
      apply_migrations:
        description: "Apply pending migrations after reviewing the dry-run"
        required: true
        default: false
        type: boolean
      deploy_functions:
        description: "Deploy the reviewed rental lifecycle Edge Functions"
        required: true
        default: false
        type: boolean
      confirmation:
        description: "Required for writes: APPLY_CHARGEURS_SETTLEMENT_STAGING"
        required: false
        default: ""
        type: string

permissions:
  contents: read

concurrency:
  group: chargeurs-settlement-supabase-gate
  cancel-in-progress: false

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: settlement-staging
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_REF: ${{ inputs.project_ref }}
      PRODUCTION_SUPABASE_PROJECT_REF: ${{ secrets.PRODUCTION_SUPABASE_PROJECT_REF }}
      HISTORICAL_AMBIGUOUS_PROJECT_REF: zoybkzkvvsbnqqarlaii
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Validate staging identity and write intent
        shell: bash
        run: |
          set -euo pipefail
          : > settlement-gate-report.txt

          missing=()
          for name in SUPABASE_ACCESS_TOKEN SUPABASE_DB_PASSWORD SUPABASE_PROJECT_REF PRODUCTION_SUPABASE_PROJECT_REF; do
            if [ -z "${!name:-}" ]; then missing+=("$name"); fi
          done
          if [ "${#missing[@]}" -gt 0 ]; then
            echo "Missing required encrypted configuration: ${missing[*]}" >&2
            echo "CONFIGURATION_READY=false" >> settlement-gate-report.txt
            exit 1
          fi

          if [ "$SUPABASE_PROJECT_REF" = "$PRODUCTION_SUPABASE_PROJECT_REF" ]; then
            echo "The selected project is the production project." >&2
            echo "STAGING_IDENTITY_VALID=false" >> settlement-gate-report.txt
            exit 1
          fi
          if [ "$SUPABASE_PROJECT_REF" = "$HISTORICAL_AMBIGUOUS_PROJECT_REF" ]; then
            echo "The selected project is the historical ambiguous project and is forbidden." >&2
            echo "STAGING_IDENTITY_VALID=false" >> settlement-gate-report.txt
            exit 1
          fi

          if { [ "${{ inputs.apply_migrations }}" = "true" ] || [ "${{ inputs.deploy_functions }}" = "true" ]; } \
             && [ "${{ inputs.confirmation }}" != "APPLY_CHARGEURS_SETTLEMENT_STAGING" ]; then
            echo "Write operations require the exact confirmation phrase." >&2
            echo "WRITE_CONFIRMATION=false" >> settlement-gate-report.txt
            exit 1
          fi

          echo "CONFIGURATION_READY=true" >> settlement-gate-report.txt
          echo "STAGING_IDENTITY_VALID=true" >> settlement-gate-report.txt
          echo "PROJECT_REF=$SUPABASE_PROJECT_REF" >> settlement-gate-report.txt
          echo "APPLY_MIGRATIONS=${{ inputs.apply_migrations }}" >> settlement-gate-report.txt
          echo "DEPLOY_FUNCTIONS=${{ inputs.deploy_functions }}" >> settlement-gate-report.txt

      - name: Link the explicitly selected staging project
        shell: bash
        run: |
          set -euo pipefail
          supabase link --project-ref "$SUPABASE_PROJECT_REF" --password "$SUPABASE_DB_PASSWORD"
          echo "PROJECT_LINKED=true" >> settlement-gate-report.txt

      - name: Inspect migration history
        shell: bash
        run: |
          set -euo pipefail
          supabase migration list --linked --password "$SUPABASE_DB_PASSWORD" \
            | tee migration-list-before.txt

      - name: Dry-run all pending migrations
        shell: bash
        run: |
          set -euo pipefail
          supabase db push \
            --linked \
            --password "$SUPABASE_DB_PASSWORD" \
            --include-all \
            --dry-run \
            | tee migration-dry-run.txt
          echo "MIGRATION_DRY_RUN=true" >> settlement-gate-report.txt

      - name: Apply migrations after explicit confirmation
        if: inputs.apply_migrations == true
        shell: bash
        run: |
          set -euo pipefail
          supabase db push \
            --linked \
            --password "$SUPABASE_DB_PASSWORD" \
            --include-all \
            --yes \
            | tee migration-push.txt
          echo "MIGRATIONS_APPLIED=true" >> settlement-gate-report.txt

      - name: Verify required migration families
        if: inputs.apply_migrations == true
        shell: bash
        run: |
          set -euo pipefail
          supabase migration list --linked --password "$SUPABASE_DB_PASSWORD" \
            | tee migration-list-after.txt
          for version in \
            20260715033000 \
            20260715170500 \
            20260715041000 \
            20260715042000 \
            20260715210000; do
            grep -q "$version" migration-list-after.txt
          done
          echo "REQUIRED_MIGRATIONS_PRESENT=true" >> settlement-gate-report.txt

      - name: Lint linked public schema
        if: inputs.apply_migrations == true
        shell: bash
        run: |
          set -euo pipefail
          supabase db lint \
            --linked \
            --schema public \
            --level error \
            --fail-on error \
            | tee database-lint.txt
          echo "DATABASE_LINT_PASSED=true" >> settlement-gate-report.txt

      - name: Verify required staging secret names
        if: inputs.deploy_functions == true
        shell: bash
        run: |
          set -euo pipefail
          supabase secrets list --project-ref "$SUPABASE_PROJECT_REF" | tee staging-secret-names.txt
          for name in PUBLIC_APP_URL STRIPE_SECRET_KEY STRIPE_WEBHOOK_SECRET; do
            grep -q "$name" staging-secret-names.txt
          done
          if ! grep -q "CHARGENOW_BASIC_AUTH" staging-secret-names.txt; then
            grep -q "CHARGENOW_BASIC_USERNAME" staging-secret-names.txt
            grep -q "CHARGENOW_BASIC_PASSWORD" staging-secret-names.txt
          fi
          if ! grep -q "CHARGENOW_CALLBACK_SIGNING_KEY" staging-secret-names.txt; then
            grep -q "CHARGENOW_EVENT_SECRET" staging-secret-names.txt
          fi
          echo "REQUIRED_SECRET_NAMES_PRESENT=true" >> settlement-gate-report.txt

      - name: Deploy reviewed rental lifecycle Edge Functions
        if: inputs.deploy_functions == true
        shell: bash
        run: |
          set -euo pipefail
          for function_name in \
            create-rental-session \
            create-stripe-checkout \
            stripe-webhook \
            eject-after-payment \
            sync-cabinet-status \
            chargenow-rent-callback \
            settle-rental-payment; do
            supabase functions deploy "$function_name" \
              --project-ref "$SUPABASE_PROJECT_REF" \
              --use-api
          done
          echo "RENTAL_LIFECYCLE_FUNCTIONS_DEPLOYED=true" >> settlement-gate-report.txt

      - name: Upload sanitized diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: settlement-supabase-gate-diagnostics
          path: |
            settlement-gate-report.txt
            migration-list-before.txt
            migration-dry-run.txt
            migration-push.txt
            migration-list-after.txt
            database-lint.txt
            staging-secret-names.txt
          if-no-files-found: ignore
          retention-days: 7
