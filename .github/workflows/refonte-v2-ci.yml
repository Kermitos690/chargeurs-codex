name: Chargeurs.ch Refonte V2 CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [feat/refonte-chargeurs-v2]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm install --no-audit --no-fund --silent
      - name: Lint
        shell: bash
        run: |
          set -o pipefail
          npm run lint -- --quiet > lint.log 2>&1 || {
            echo "===== ESLint errors ====="
            tail -n 250 lint.log
            exit 1
          }
      - name: Typecheck
        shell: bash
        run: |
          set -o pipefail
          npm run typecheck > typecheck.log 2>&1 || {
            echo "===== TypeScript errors ====="
            tail -n 250 typecheck.log
            exit 1
          }
      - name: Unit tests
        shell: bash
        run: |
          set -o pipefail
          npm test > tests.log 2>&1 || {
            echo "===== Test failures ====="
            tail -n 250 tests.log
            exit 1
          }
      - name: Production build
        shell: bash
        run: |
          set -o pipefail
          npm run build > build.log 2>&1 || {
            echo "===== Build errors ====="
            tail -n 250 build.log
            exit 1
          }
