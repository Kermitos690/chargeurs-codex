name: Chargeurs.ch Refonte V2 CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [feat/refonte-chargeurs-v2]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm install --no-audit --no-fund --silent
      - name: Lint
        run: npm run lint -- --quiet
      - name: Typecheck
        run: npm run typecheck
      - name: Unit tests
        run: npm test
      - name: Production build
        run: npm run build
