name: Chargeurs.ch Refonte V2 CI

# Emergency cost control: manual execution only.
on:
  workflow_dispatch:

concurrency:
  group: refonte-v2-manual
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --no-fund --prefer-offline
      - name: Lint
        run: npm run lint -- --quiet
      - name: Typecheck
        run: npm run typecheck
      - name: Unit tests
        run: npm test
      - name: Production build
        run: npm run build

  kiosk-edge-function:
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Install dependencies required by npm imports
        run: npm ci --no-audit --no-fund --prefer-offline
      - name: Check kiosk cabinet synchronization
        run: deno check supabase/functions/sync-cabinet-status/index.ts
      - name: Test kiosk synchronization authorization contract
        run: deno test --allow-read supabase/functions/tests/kiosk_sync_auth_contract.test.ts

  kiosk-beta-release-gate:
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 8
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: chargeurs_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d chargeurs_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: 127.0.0.1
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: chargeurs_ci
    steps:
      - uses: actions/checkout@v4
      - name: Validate fail-closed kiosk beta release gate
        run: psql -v ON_ERROR_STOP=1 -f supabase/tests/kiosk-beta-release-gate.sql
