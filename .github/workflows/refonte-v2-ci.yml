name: Chargeurs.ch Refonte V2 CI

on:
  pull_request:
    branches: [main]
  push:
    branches:
      - feat/refonte-chargeurs-v2
      - integration/chargeurs-beta-platform

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm install --no-audit --no-fund --silent
      - name: Lint
        id: lint
        continue-on-error: true
        run: npm run lint -- --quiet > lint.log 2>&1
      - name: Typecheck
        id: typecheck
        continue-on-error: true
        run: npm run typecheck > typecheck.log 2>&1
      - name: Unit tests
        id: tests
        continue-on-error: true
        run: npm test > tests.log 2>&1
      - name: Production build
        id: build
        continue-on-error: true
        run: npm run build > build.log 2>&1
      - name: Upload quality logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quality-logs
          path: |
            lint.log
            typecheck.log
            tests.log
            build.log
          if-no-files-found: ignore
          retention-days: 3
      - name: Fail on quality errors
        if: always()
        run: |
          echo "lint=${{ steps.lint.outcome }}"
          echo "typecheck=${{ steps.typecheck.outcome }}"
          echo "tests=${{ steps.tests.outcome }}"
          echo "build=${{ steps.build.outcome }}"
          test "${{ steps.lint.outcome }}" = success
          test "${{ steps.typecheck.outcome }}" = success
          test "${{ steps.tests.outcome }}" = success
          test "${{ steps.build.outcome }}" = success

  platform-api-core:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Check Platform API authentication core
        run: deno check supabase/functions/_shared/platformApi.ts
      - name: Check Platform API key administration
        run: deno check supabase/functions/api-key-admin/index.ts
      - name: Test Platform API authentication core
        run: deno test --allow-env supabase/functions/tests/platform_api.test.ts
      - name: Assert Platform API remains read-only and fail-closed
        shell: bash
        run: |
          set -euo pipefail
          migration="supabase/migrations/20260715110000_platform_api_v1.sql"
          admin="supabase/functions/api-key-admin/index.ts"
          grep -F "alter table public.api_keys enable row level security" "$migration"
          grep -F "revoke all on public.api_keys from public, anon, authenticated" "$migration"
          grep -F "grant all on public.api_keys to service_role" "$migration"
          grep -F "PLATFORM_API_LIVE_KEYS_ENABLED" "$admin"
          grep -F '"rentals:read"' "$admin"
          ! grep -F '"rentals:write"' "$admin"
          ! grep -F '"payments:write"' "$admin"
          ! grep -F '"stations:write"' "$admin"
          ! grep -Eiq "(sk_live_|sk_test_|service_role_key|password[[:space:]]*=)" "$migration" "$admin"

  payment-settlement-core:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Check canonical settlement planner
        run: deno check supabase/functions/_shared/settlement.ts
      - name: Test canonical settlement planner
        run: deno test supabase/functions/tests/settlement.test.ts
      - name: Assert legacy rentals cannot be auto-settled
        shell: bash
        run: |
          set -euo pipefail
          schema="supabase/migrations/20260715200000_payment_settlement_strategy.sql"
          inbox="supabase/migrations/20260715201000_retryable_stripe_webhook_inbox.sql"
          grep -F "set settlement_status = 'legacy'" "$schema"
          grep -F "'legacy','pending','authorized','prepaid','settling','settled'" "$schema"
          grep -F "and settlement_status in (" "$schema"
          ! grep -F "and settlement_status in ('legacy'" "$schema"
          grep -F "revoke all on function public.claim_rental_settlement" "$schema"
          grep -F "grant execute on function public.claim_rental_settlement" "$schema"
          grep -F "where provider = 'stripe'" "$inbox"
          grep -F "grant execute on function public.claim_stripe_webhook_event" "$inbox"
          ! grep -Eiq "(sk_live_|sk_test_|service_role_key|password[[:space:]]*=)" "$schema" "$inbox"

  kiosk-edge-function:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Install dependencies required by npm imports
        run: npm install --no-audit --no-fund --silent
      - name: Check kiosk cabinet synchronization
        id: deno_check
        continue-on-error: true
        run: deno check supabase/functions/sync-cabinet-status/index.ts > deno-check.log 2>&1
      - name: Test kiosk synchronization authorization contract
        id: deno_test
        continue-on-error: true
        run: deno test --allow-read supabase/functions/tests/kiosk_sync_auth_contract.test.ts > deno-test.log 2>&1
      - name: Upload Deno diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kiosk-deno-logs
          path: |
            deno-check.log
            deno-test.log
          if-no-files-found: ignore
          retention-days: 3
      - name: Fail on Deno errors
        if: always()
        run: |
          echo "deno_check=${{ steps.deno_check.outcome }}"
          echo "deno_test=${{ steps.deno_test.outcome }}"
          test "${{ steps.deno_check.outcome }}" = success
          test "${{ steps.deno_test.outcome }}" = success

  kiosk-beta-release-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: chargeurs_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d chargeurs_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: 127.0.0.1
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: chargeurs_ci
    steps:
      - uses: actions/checkout@v4
      - name: Validate fail-closed kiosk beta release gate
        run: psql -v ON_ERROR_STOP=1 -f supabase/tests/kiosk-beta-release-gate.sql
