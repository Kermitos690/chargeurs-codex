name: Chargeurs.ch Refonte V2 CI

on:
  pull_request:
    branches: [main]
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - ".github/ISSUE_TEMPLATE/**"
  push:
    branches: [main]
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - ".github/ISSUE_TEMPLATE/**"
  workflow_dispatch:

concurrency:
  group: refonte-v2-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --no-fund --prefer-offline
      - name: Lint
        run: npm run lint -- --quiet
      - name: Typecheck
        run: npm run typecheck
      - name: Unit tests
        run: npm test
      - name: Production build
        run: npm run build

  kiosk-edge-function:
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Install dependencies required by npm imports
        run: npm ci --no-audit --no-fund --prefer-offline
      - name: Check kiosk cabinet synchronization
        run: deno check supabase/functions/sync-cabinet-status/index.ts
      - name: Test kiosk synchronization authorization contract
        run: deno test --allow-read supabase/functions/tests/kiosk_sync_auth_contract.test.ts

  rental-lifecycle-edge-functions:
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Install dependencies required by npm imports
        run: npm ci --no-audit --no-fund --prefer-offline
      - name: Check integrated payment and hardware functions
        shell: bash
        run: |
          set -euo pipefail
          for file in \
            supabase/functions/create-stripe-checkout/index.ts \
            supabase/functions/stripe-webhook/index.ts \
            supabase/functions/eject-after-payment/index.ts \
            supabase/functions/chargenow-rent-callback/index.ts \
            supabase/functions/settle-rental-payment/index.ts; do
            deno check "$file"
          done
      - name: Test settlement and orchestrator rules
        run: |
          deno test --allow-env --allow-read \
            supabase/functions/tests/settlement.test.ts \
            supabase/functions/tests/orchestrator_runtime.test.ts \
            supabase/functions/tests/chargenow_callback_auth.test.ts \
            supabase/functions/tests/settlement_retry_contract.test.ts
      - name: Reject raw public exceptions and global query secrets
        shell: bash
        run: |
          set -euo pipefail
          files=(
            supabase/functions/create-stripe-checkout/index.ts
            supabase/functions/stripe-webhook/index.ts
            supabase/functions/eject-after-payment/index.ts
            supabase/functions/chargenow-rent-callback/index.ts
            supabase/functions/settle-rental-payment/index.ts
            supabase/functions/_shared/settlementRuntime.ts
          )
          ! grep -nE 'error:[[:space:]]*String\(|detail:[[:space:]]*String\(' "${files[@]}"
          ! grep -nE 'searchParams\.get\("secret"\)' \
            supabase/functions/chargenow-rent-callback/index.ts \
            supabase/functions/_shared/chargenowCallbackAuth.ts

  database-gates:
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 8
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: chargeurs_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d chargeurs_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: 127.0.0.1
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: chargeurs_ci
    steps:
      - uses: actions/checkout@v4
      - name: Validate fail-closed kiosk beta release gate
        run: psql -v ON_ERROR_STOP=1 -f supabase/tests/kiosk-beta-release-gate.sql
      - name: Validate retryable ChargeNow return inbox
        run: psql -v ON_ERROR_STOP=1 -f supabase/tests/chargenow-return-inbox.sql
