name: Kiosk enroll diagnostic

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/kiosk-enroll-diagnostic.yml

permissions:
  contents: read

jobs:
  diagnose:
    if: github.head_ref == 'agent/finalize-chargeurs-platform'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Probe enrollment configuration without consuming a real code
        shell: bash
        run: |
          set -euo pipefail
          response="$(curl -sS -w '\nHTTP_STATUS:%{http_code}\n' \
            -X POST 'https://xqepbqnaenoeyfjkjnzl.supabase.co/functions/v1/kiosk-enroll' \
            -H 'Content-Type: application/json' \
            --data '{"pairingCode":"kc_AAAAAAAAAAAAAAAAAAAAAAAA","devicePublicId":"11111111-1111-4111-8111-111111111111","appVersion":"diagnostic"}')"
          printf '%s\n' "$response"
          mkdir -p diagnostic
          printf '%s\n' "$response" > diagnostic/kiosk-enroll-response.txt

      - name: Upload diagnostic response
        uses: actions/upload-artifact@v4
        with:
          name: kiosk-enroll-diagnostic
          retention-days: 1
          if-no-files-found: error
          path: diagnostic/kiosk-enroll-response.txt
