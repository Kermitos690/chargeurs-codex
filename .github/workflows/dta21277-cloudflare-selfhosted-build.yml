name: DTA21277 Cloudflare self-hosted APK

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/dta21277-cloudflare-selfhosted-build.yml"

permissions:
  contents: read

concurrency:
  group: dta21277-cloudflare-selfhosted-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-staging-apk:
    runs-on: [self-hosted, macOS]
    timeout-minutes: 35
    env:
      LANG: C
      LC_ALL: C
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@v4

      - name: Verify local signing identity and Android toolchain
        shell: bash
        run: |
          set -euo pipefail

          EXPECTED_SIGNER="1e4d4c12ec3b21a3ff7186fb7bdcf4097f13b0a8d7a6b6fc7ba7dbebd92042f6"

          JAVA_HOME_VALUE=""
          for candidate in \
            "${JAVA_HOME:-}" \
            "$HOME/Library/Caches/chargeurs-jdk/temurin21-x64/unpack/jdk-21.0.12.1+1/Contents/Home" \
            "$HOME/Library/Caches/chargeurs-jdk/temurin21-aarch64/unpack/jdk-21.0.12.1+1/Contents/Home" \
            "/Applications/Android Studio.app/Contents/jbr/Contents/Home" \
            "/opt/homebrew/opt/openjdk@17/libexec/openjdk.jdk/Contents/Home" \
            "/opt/homebrew/opt/openjdk/libexec/openjdk.jdk/Contents/Home"
          do
            if [ -n "$candidate" ] && [ -x "$candidate/bin/java" ] && [ -x "$candidate/bin/keytool" ]; then
              JAVA_HOME_VALUE="$candidate"
              break
            fi
          done

          if [ -z "$JAVA_HOME_VALUE" ] && [ -d "$HOME/Library/Caches/chargeurs-jdk" ]; then
            JAVA_BIN="$(find "$HOME/Library/Caches/chargeurs-jdk" -type f -path '*/Contents/Home/bin/java' -perm -u+x 2>/dev/null | head -1 || true)"
            if [ -n "$JAVA_BIN" ]; then
              JAVA_HOME_VALUE="${JAVA_BIN%/bin/java}"
            fi
          fi

          test -n "$JAVA_HOME_VALUE" || { echo "JDK 17+ is missing on self-hosted iMac" >&2; exit 20; }
          test -x "$JAVA_HOME_VALUE/bin/java" && test -x "$JAVA_HOME_VALUE/bin/keytool"
          echo "JAVA_HOME=$JAVA_HOME_VALUE" >> "$GITHUB_ENV"
          echo "$JAVA_HOME_VALUE/bin" >> "$GITHUB_PATH"

          KEYSTORE="$HOME/.android/debug.keystore"
          test -s "$KEYSTORE" || { echo "Expected local debug keystore is missing" >&2; exit 21; }

          actual="$("$JAVA_HOME_VALUE/bin/keytool" -exportcert \
            -keystore "$KEYSTORE" -storepass android -alias androiddebugkey \
            | shasum -a 256 | awk '{print $1}' | tr '[:upper:]' '[:lower:]')"
          test "$actual" = "$EXPECTED_SIGNER" || {
            echo "DTA21277 signer mismatch; refusing to build a non-updatable APK" >&2
            echo "actual=$actual" >&2
            exit 22
          }

          ANDROID_HOME_VALUE="${ANDROID_HOME:-$HOME/Library/Android/sdk}"
          test -x "$ANDROID_HOME_VALUE/platform-tools/adb" || { echo "Android SDK is missing" >&2; exit 23; }
          echo "ANDROID_HOME=$ANDROID_HOME_VALUE" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME_VALUE" >> "$GITHUB_ENV"
          echo "EXPECTED_SIGNER=$EXPECTED_SIGNER" >> "$GITHUB_ENV"

          "$JAVA_HOME_VALUE/bin/java" -version
          echo "SIGNER_GATE=PASS"

      - name: Build and test version 159
        working-directory: android-kiosk
        env:
          CHARGEURS_ENROLLMENT_URL: https://xqepbqnaenoeyfjkjnzl.supabase.co/functions/v1/kiosk-enroll
          CHARGEURS_KIOSK_PUBLIC_BASE_URL: https://chargeurs-ch-staging.vercel.app
          CHARGEURS_KIOSK_WEB_BASE_URL: https://chargeurs-ch-staging-cf.pages.dev
          CHARGEURS_STRIPE_TERMINAL_BACKEND_URL: https://xqepbqnaenoeyfjkjnzl.supabase.co/functions/v1/stripe-terminal-backend
        run: |
          set -euo pipefail
          chmod +x gradlew
          printf 'sdk.dir=%s\n' "$ANDROID_HOME" > local.properties
          unset CHARGEURS_STAGING_KEYSTORE_PATH CHARGEURS_STAGING_KEYSTORE_PASSWORD CHARGEURS_STAGING_KEY_ALIAS CHARGEURS_STAGING_KEY_PASSWORD || true
          ./gradlew --no-daemon --console=plain clean testDebugUnitTest lintStaging assembleStaging

      - name: Verify APK identity and fail-closed contract
        shell: bash
        run: |
          set -euo pipefail
          APK="android-kiosk/app/build/outputs/apk/staging/app-staging.apk"
          test -s "$APK"

          AAPT="$(find "$ANDROID_HOME/build-tools" -type f -name aapt -perm -u+x 2>/dev/null | sort -V | tail -1)"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner -perm -u+x 2>/dev/null | sort -V | tail -1)"
          test -x "$AAPT" && test -x "$APKSIGNER"

          badging="$($AAPT dump badging "$APK" | head -1)"
          printf '%s\n' "$badging" | grep -F "package: name='ch.chargeurs.kiosk.staging'"
          printf '%s\n' "$badging" | grep -F "versionCode='159'"
          printf '%s\n' "$badging" | grep -F "versionName='1.0.59-terminal-sdk580-cloudflare-runtime-staging'"

          signer="$($APKSIGNER verify --print-certs "$APK" 2>/dev/null \
            | sed -n 's/^Signer #1 certificate SHA-256 digest: //p' \
            | head -1 | tr '[:upper:]' '[:lower:]' | tr -d ':')"
          test "$signer" = "$EXPECTED_SIGNER" || { echo "Built APK signer mismatch" >&2; exit 24; }

          grep -F 'implementation("com.stripe:stripeterminal:5.8.0")' android-kiosk/app/build.gradle.kts
          grep -F 'buildConfigField("boolean", "HARDWARE_EJECTION_ENABLED", "false")' android-kiosk/app/build.gradle.kts
          grep -F 'stagingKioskWebBaseUrl = "https://chargeurs-ch-staging-cf.pages.dev"' android-kiosk/app/build.gradle.kts
          grep -F 'stagingKioskPublicBaseUrl = "https://chargeurs-ch-staging.vercel.app"' android-kiosk/app/build.gradle.kts

          mkdir -p dist
          NAME="Chargeurs_CH_Kiosk_1.0.59-terminal-sdk580-cloudflare-runtime-staging.apk"
          cp "$APK" "dist/$NAME"
          APK_SHA="$(shasum -a 256 "dist/$NAME" | awk '{print $1}')"
          printf '%s  %s\n' "$APK_SHA" "$NAME" > dist/SHA256SUMS.txt
          cat > dist/PROVENANCE.txt <<EOF
          sha=$GITHUB_SHA
          package=ch.chargeurs.kiosk.staging
          versionCode=159
          versionName=1.0.59-terminal-sdk580-cloudflare-runtime-staging
          enrollmentOrigin=https://chargeurs-ch-staging.vercel.app
          webRuntimeOrigin=https://chargeurs-ch-staging-cf.pages.dev
          stripeTerminalSdk=5.8.0
          physicalEjectionEnabled=false
          paymentMode=TEST_ONLY
          signerCertificateSha256=$signer
          apkSha256=$APK_SHA
          installAction=ADB_INSTALL_R_DTA21277_ONLY
          EOF

          PERSIST_DIR="$HOME/chargeurs-builds/dta21277/cloudflare-159"
          mkdir -p "$PERSIST_DIR"
          chmod 700 "$HOME/chargeurs-builds" "$HOME/chargeurs-builds/dta21277" "$PERSIST_DIR" 2>/dev/null || true
          cp dist/* "$PERSIST_DIR/"
          echo "VERIFIED_APK=$PERSIST_DIR/$NAME" >> "$GITHUB_ENV"
          echo "APK_SHA256=$APK_SHA" >> "$GITHUB_ENV"
          echo "VERIFIED_APK_SHA256=$APK_SHA"
          echo "APK_CONTRACT_GATE=PASS"

      - name: Install in place on DTA21277 only
        shell: bash
        run: |
          set -euo pipefail

          TARGET_STATION="DTA21277"
          EXPECTED_DEVICE_PUBLIC_ID="c1651928-082d-4220-a4dc-77e9532ae8a2"
          EXPECTED_SIGNER="1e4d4c12ec3b21a3ff7186fb7bdcf4097f13b0a8d7a6b6fc7ba7dbebd92042f6"
          PKG="ch.chargeurs.kiosk.staging"
          ADB="$ANDROID_HOME/platform-tools/adb"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner -perm -u+x 2>/dev/null | sort -V | tail -1)"
          test -s "$VERIFIED_APK" && test -x "$ADB" && test -x "$APKSIGNER"

          echo "TARGET_STATION=$TARGET_STATION"
          echo "PAYMENT_ACTION=NONE"
          echo "HARDWARE_EJECTION_ACTION=NONE"
          echo "CHARGENOW_ACTION=NONE"

          while IFS= read -r endpoint; do
            [ -n "$endpoint" ] || continue
            "$ADB" connect "$endpoint" >/dev/null 2>&1 || true
          done < <("$ADB" mdns services 2>/dev/null | grep -Eo '([0-9]{1,3}\.){3}[0-9]{1,3}:[0-9]+' | sort -u || true)

          read_pref() {
            local serial="$1" file="$2" key="$3"
            "$ADB" -s "$serial" shell "run-as '$PKG' cat 'shared_prefs/$file.xml' 2>/dev/null" \
              | tr -d '\r' \
              | sed -n "s/.*<string name=\"$key\">\([^<]*\)<\\/string>.*/\1/p" \
              | head -1
          }

          SERIAL=""
          while IFS= read -r candidate; do
            [ -n "$candidate" ] || continue
            station="$(read_pref "$candidate" chargeurs_kiosk_config station_id || true)"
            device_id="$(read_pref "$candidate" chargeurs_device_identity public_id || true)"
            if [ "$station" = "$TARGET_STATION" ] && [ "$device_id" = "$EXPECTED_DEVICE_PUBLIC_ID" ]; then
              SERIAL="$candidate"
              break
            fi
          done < <("$ADB" devices | awk 'NR>1 && $2 == "device" {print $1}')

          [ -n "$SERIAL" ] || { echo "DTA21277 is not reachable over authorized ADB" >&2; exit 31; }
          echo "ADB_TARGET_CONFIRMED=$TARGET_STATION"

          DUMP="$("$ADB" -s "$SERIAL" shell dumpsys package "$PKG" | tr -d '\r')"
          OLD_CODE="$(printf '%s\n' "$DUMP" | sed -n 's/.*versionCode=\([0-9][0-9]*\).*/\1/p' | head -1)"
          OLD_NAME="$(printf '%s\n' "$DUMP" | sed -n 's/.*versionName=\(.*\)$/\1/p' | head -1)"
          case "$OLD_CODE" in
            158|159) ;;
            *) echo "Unexpected installed versionCode=$OLD_CODE" >&2; exit 32 ;;
          esac

          BASE_PATH="$("$ADB" -s "$SERIAL" shell pm path "$PKG" | head -1 | sed 's/^package://' | tr -d '\r')"
          [ -n "$BASE_PATH" ] || { echo "Installed APK path unavailable" >&2; exit 33; }
          BACKUP_DIR="$HOME/chargeurs-field-backups/dta21277-$(date +%Y%m%d-%H%M%S)"
          mkdir -p "$BACKUP_DIR"
          chmod 700 "$BACKUP_DIR"
          "$ADB" -s "$SERIAL" pull "$BASE_PATH" "$BACKUP_DIR/pre-update-base.apk" >/dev/null

          OLD_SIGNER="$($APKSIGNER verify --print-certs "$BACKUP_DIR/pre-update-base.apk" 2>/dev/null \
            | sed -n 's/^Signer #1 certificate SHA-256 digest: //p' \
            | head -1 | tr '[:upper:]' '[:lower:]' | tr -d ':')"
          [ "$OLD_SIGNER" = "$EXPECTED_SIGNER" ] || { echo "Installed DTA21277 signer mismatch" >&2; exit 34; }

          BEFORE_CONFIG_SHA="$("$ADB" -s "$SERIAL" shell "run-as '$PKG' cat shared_prefs/chargeurs_kiosk_config.xml 2>/dev/null" \
            | tr -d '\r' | shasum -a 256 | awk '{print $1}')"
          [ -n "$BEFORE_CONFIG_SHA" ] || { echo "Secure kiosk config unavailable before update" >&2; exit 35; }

          echo "INSTALLED_BEFORE_VERSION_CODE=$OLD_CODE"
          echo "INSTALLED_BEFORE_VERSION_NAME=$OLD_NAME"
          echo "INSTALLED_SIGNER_GATE=PASS"

          if [ "$OLD_CODE" = "158" ]; then
            INSTALL_OUT="$("$ADB" -s "$SERIAL" install -r "$VERIFIED_APK" 2>&1)" || {
              printf '%s\n' "$INSTALL_OUT" >&2
              exit 36
            }
            printf '%s\n' "$INSTALL_OUT" | grep -q 'Success' || { printf '%s\n' "$INSTALL_OUT" >&2; exit 37; }
            echo "IN_PLACE_UPDATE=PASS"
          else
            echo "IN_PLACE_UPDATE=ALREADY_VERSION_159"
          fi

          AFTER_CONFIG_SHA="$("$ADB" -s "$SERIAL" shell "run-as '$PKG' cat shared_prefs/chargeurs_kiosk_config.xml 2>/dev/null" \
            | tr -d '\r' | shasum -a 256 | awk '{print $1}')"
          if [ "$AFTER_CONFIG_SHA" != "$BEFORE_CONFIG_SHA" ]; then
            echo "Secure kiosk config changed during package replacement; attempting APK rollback" >&2
            "$ADB" -s "$SERIAL" install -r -d "$BACKUP_DIR/pre-update-base.apk" >/dev/null 2>&1 || true
            exit 38
          fi

          FINAL_DUMP="$("$ADB" -s "$SERIAL" shell dumpsys package "$PKG" | tr -d '\r')"
          FINAL_CODE="$(printf '%s\n' "$FINAL_DUMP" | sed -n 's/.*versionCode=\([0-9][0-9]*\).*/\1/p' | head -1)"
          FINAL_NAME="$(printf '%s\n' "$FINAL_DUMP" | sed -n 's/.*versionName=\(.*\)$/\1/p' | head -1)"
          [ "$FINAL_CODE" = "159" ] || { echo "Final versionCode mismatch: $FINAL_CODE" >&2; exit 39; }

          FINAL_STATION="$(read_pref "$SERIAL" chargeurs_kiosk_config station_id || true)"
          FINAL_DEVICE_ID="$(read_pref "$SERIAL" chargeurs_device_identity public_id || true)"
          [ "$FINAL_STATION" = "$TARGET_STATION" ] || exit 40
          [ "$FINAL_DEVICE_ID" = "$EXPECTED_DEVICE_PUBLIC_ID" ] || exit 41

          "$ADB" -s "$SERIAL" shell am force-stop "$PKG" >/dev/null 2>&1 || true
          "$ADB" -s "$SERIAL" shell am start -W -n "$PKG/ch.chargeurs.kiosk.MainActivity" >/dev/null
          sleep 5

          echo "FINAL_VERSION_CODE=$FINAL_CODE"
          echo "FINAL_VERSION_NAME=$FINAL_NAME"
          echo "SECURE_CONFIG_PRESERVED=PASS"
          echo "DEVICE_BINDING_PRESERVED=PASS"
          echo "DTA21277_CLOUDFLARE_UPDATE=PASS"
