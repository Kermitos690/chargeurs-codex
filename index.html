    <script>
      // The physical kiosk panel is 1280×720, but Android WebView reports a
      // density-reduced CSS viewport (for example ~768×432). The production V4
      // HMI is intentionally authored against the physical 1280×720 canvas.
      // Normalize only the native kiosk wrapper before React/CSS is evaluated;
      // normal mobile/desktop visitors keep the standard device-width viewport.
      (function normalizeNativeKioskViewport() {
        try {
          var path = window.location.pathname || "";
          var isKioskPath = path === "/kiosk" || path.indexOf("/kiosk/") === 0;
          // MainActivity appends `ChargeursKiosk/<version>` to the UA before
          // navigation. Use that synchronous marker as well as the JS bridge so
          // OEM WebViews cannot miss the 1280×720 bootstrap due to bridge timing.
          var kioskUserAgent = /(?:^|\s)ChargeursKiosk\//.test(navigator.userAgent || "");
          var isNativeKiosk = kioskUserAgent || typeof window.ChargeursNative !== "undefined";
          if (!isKioskPath || !isNativeKiosk) return;

          var viewport = document.getElementById("chargeurs-viewport");
          if (!viewport) return;

          var sourceWidth = Math.max(1, window.innerWidth || document.documentElement.clientWidth || 1280);
          var sourceHeight = Math.max(1, window.innerHeight || document.documentElement.clientHeight || 720);
          var scale = Math.min(sourceWidth / 1280, sourceHeight / 720);
          if (!Number.isFinite(scale) || scale <= 0) scale = 1;
          scale = Math.max(0.25, Math.min(2, scale));
          var fixedScale = scale.toFixed(6);

          viewport.setAttribute(
            "content",
            "width=1280, initial-scale=" + fixedScale +
              ", minimum-scale=" + fixedScale +
              ", maximum-scale=" + fixedScale +
              ", viewport-fit=cover, user-scalable=no"
          );
          document.documentElement.dataset.kioskPhysicalViewport = "1280x720";
          document.documentElement.dataset.kioskNativeDetected = kioskUserAgent ? "ua" : "bridge";
          window.__CHARGEURS_KIOSK_VIEWPORT__ = {
            sourceWidth: sourceWidth,
            sourceHeight: sourceHeight,
            targetWidth: 1280,
            targetHeight: 720,
            scale: scale,
            nativeDetection: kioskUserAgent ? "ua" : "bridge"
          };
        } catch (error) {
          // Fail open to the ordinary responsive viewport. The kiosk remains
          // usable even if an OEM WebView rejects dynamic viewport mutation.
        }
      })();
    </script>
