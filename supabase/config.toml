project_id = "chargeurs-codex-local"

[auth]
site_url = "https://chargeurs-ch-staging.vercel.app"
additional_redirect_urls = [
  "https://chargeurs-ch-staging.vercel.app/admin",
  "https://chargeurs-ch-staging.vercel.app/admin/reset-password",
  "https://chargeurs-ch-staging.vercel.app/compte",
  "https://chargeurs-ch-staging.vercel.app/compte/reset-password",
  "https://chargeurs-ch-staging.vercel.app/compte/connect/**",
  "https://chargeurs-ch-staging.vercel.app/account",
  "https://chargeurs-ch-staging.vercel.app/account/reset-password",
]

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = true
secure_password_change = true
max_frequency = "1m"
otp_length = 8
otp_expiry = 3600

[auth.mfa.totp]
enroll_enabled = true
verify_enabled = true

[storage.vector]
enabled = false

